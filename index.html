<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏编辑器 · 2D / 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #14171d;
    --panel: #1b1f27;
    --panel2: #222731;
    --border: #2c3340;
    --text: #d5dae3;
    --text-dim: #7c8698;
    --accent: #4a9eff;
    --accent2: #ff6b6b;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- 工具栏 ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 14px; letter-spacing: .5px; margin-right: 6px; }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
  .spacer { flex: 1; }

  button, .seg button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 11px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all .12s;
    white-space: nowrap;
  }
  button:hover { background: #2b3140; border-color: #3d4557; }
  button:active { transform: translateY(1px); }
  button.primary { background: #1e6fd9; border-color: #2a7fe8; color: #fff; }
  button.primary:hover { background: #2a7fe8; }
  button.danger { color: #ff8a8a; }
  button.danger:hover { background: #3a2226; border-color: #5a3038; }

  .seg { display: flex; background: var(--panel2); border-radius: 7px; padding: 2px; border: 1px solid var(--border); }
  .seg button { border: none; background: transparent; padding: 5px 16px; border-radius: 5px; font-weight: 600; }
  .seg button.active { background: var(--accent); color: #fff; }

  #addBtns { display: flex; gap: 5px; flex-wrap: wrap; }
  #addBtns button { padding: 6px 9px; }

  /* ---------- 主体 ---------- */
  main { flex: 1; display: flex; min-height: 0; }

  aside {
    background: var(--panel);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  #hierarchy { width: 190px; border-right: 1px solid var(--border); }
  #inspector { width: 245px; border-left: 1px solid var(--border); }

  .panel-title {
    padding: 9px 12px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #objList { list-style: none; overflow-y: auto; flex: 1; padding: 4px; }
  #objList li {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 5px;
    cursor: pointer; font-size: 12.5px;
    margin-bottom: 1px;
  }
  #objList li:hover { background: var(--panel2); }
  #objList li.sel { background: #1e4f8f; color: #fff; }
  #objList li .ico { font-size: 12px; opacity: .85; width: 14px; text-align: center; }
  #objList li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #objList li .eye { opacity: .45; font-size: 11px; padding: 0 2px; }
  #objList li .eye:hover { opacity: 1; }

  #viewport { flex: 1; position: relative; min-width: 0; background: #1a1d24; overflow: hidden; }
  #cv2d { position: absolute; inset: 0; display: block; cursor: crosshair; }
  #vp3d { position: absolute; inset: 0; display: none; }
  #vp3d canvas { display: block; }

  /* ---------- 属性面板 ---------- */
  #props { overflow-y: auto; flex: 1; padding: 10px; }
  .empty { color: var(--text-dim); text-align: center; padding: 30px 10px; font-size: 12px; }
  .field { margin-bottom: 9px; }
  .field > label {
    display: block; font-size: 11px; color: var(--text-dim);
    margin-bottom: 4px; font-weight: 600; letter-spacing: .3px;
  }
  .field input[type=number], .field input[type=text] {
    width: 100%; background: #12151b; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 8px; font-size: 12px; font-family: inherit;
    outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .vec-group { display: flex; gap: 5px; }
  .vec-item { flex: 1; display: flex; align-items: center; background: #12151b;
    border: 1px solid var(--border); border-radius: 5px; padding-left: 6px; }
  .vec-item span { font-size: 10px; color: var(--text-dim); font-weight: 700; }
  .vec-item input { border: none !important; background: transparent !important; padding: 5px 5px !important; }
  .vec-item:focus-within { border-color: var(--accent); }

  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-row input[type=color] {
    width: 40px; height: 26px; padding: 0; border: 1px solid var(--border);
    border-radius: 5px; background: #12151b; cursor: pointer;
  }
  .color-row .hex { font-size: 11px; color: var(--text-dim); font-family: monospace; }

  .check-row { display: flex; align-items: center; gap: 8px; }
  .check-row input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .check-row label { font-size: 12px; color: var(--text); }

  .group-title {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    color: var(--text-dim); text-transform: uppercase;
    margin: 16px 0 8px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .group-title:first-child { margin-top: 0; border-top: none; padding-top: 0; }

  /* ---------- 状态栏 ---------- */
  #statusbar {
    padding: 5px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim);
    display: flex; gap: 18px; flex-shrink: 0;
  }
  #statusbar b { color: var(--text); font-weight: 600; }

  .hint { color: var(--text-dim); font-size: 11px; padding: 6px 10px 0; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333b4a; border-radius: 5px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: #445067; }

  .toast {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: #2a7fe8; color: #fff; padding: 8px 20px; border-radius: 20px;
    font-size: 12.5px; pointer-events: none; opacity: 0; transition: opacity .25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="brand">🎮 <span>Game</span> Editor</div>
    <div class="seg" id="modeSeg">
      <button data-mode="2d" class="active">2D</button>
      <button data-mode="3d">3D</button>
    </div>
    <div class="sep"></div>
    <div id="addBtns"></div>
    <div class="sep"></div>
    <button id="playBtn" class="primary">▶ 播放</button>
    <button id="stopBtn">■ 停止</button>
    <div class="spacer"></div>
    <button id="dupBtn">⧉ 复制</button>
    <button id="delBtn" class="danger">🗑 删除</button>
    <button id="saveBtn">💾 导出</button>
    <button id="loadBtn">📂 导入</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
  </header>

  <main>
    <aside id="hierarchy">
      <div class="panel-title">层级</div>
      <ul id="objList"></ul>
    </aside>

    <div id="viewport">
      <canvas id="cv2d"></canvas>
      <div id="vp3d"></div>
    </div>

    <aside id="inspector">
      <div class="panel-title">属性</div>
      <div id="props"></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="stMode">模式：<b>2D</b></span>
    <span id="stSel">未选中</span>
    <span id="stHint">滚轮缩放 · 拖拽平移 · Del 删除 · Ctrl+D 复制</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* =========================================================
   基础工具
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let _id = 1;
const uid = () => 'o' + (_id++);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const d2r = d => d * Math.PI / 180;
const r2d = r => r * 180 / Math.PI;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg, ms = 1600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), ms);
}

/* =========================================================
   全局状态
   ========================================================= */
const state = {
  mode: '2d',
  selectedId: null,
  playing: false,
  scenes: { '2d': [], '3d': [] },
  cam2d: { x: 0, y: 0, zoom: 1 },
  gizmo: 'translate'
};

const objs = () => state.scenes[state.mode];
const getSelected = () => objs().find(o => o.id === state.selectedId) || null;

/* =========================================================
   初始场景
   ========================================================= */
function seed() {
  state.scenes['2d'] = [
    { id: uid(), name: '地面', type: 'rect', x: 0, y: 260, w: 620, h: 44, rot: 0,
      color: '#3a4354', radius: 8, visible: true, vx: 0, vy: 0, gravity: 0, bounce: 0 },
    { id: uid(), name: '玩家', type: 'rect', x: -120, y: -60, w: 48, h: 48, rot: 0,
      color: '#4a9eff', radius: 10, visible: true, vx: 0, vy: 0, gravity: 900, bounce: 0.5 },
    { id: uid(), name: '弹球', type: 'circle', x: 130, y: -180, w: 46, h: 46, rot: 0,
      color: '#ff6b6b', visible: true, vx: 0, vy: 0, gravity: 900, bounce: 0.78 },
    { id: uid(), name: '标题', type: 'text', x: 0, y: -260, w: 180, h: 30, rot: 0,
      color: '#e8eef8', text: 'HELLO WORLD', fontSize: 30, visible: true,
      vx: 0, vy: 0, gravity: 0, bounce: 0 }
  ];
  state.scenes['3d'] = [
    { id: uid(), name: '地面', type: 'plane', pos: [0, 0, 0], rot: [-90, 0, 0], scale: [16, 16, 1],
      color: '#2f3646', visible: true, spin: 0, gravity: 0, vx: 0, vy: 0, vz: 0, bounce: 0.5 },
    { id: uid(), name: '立方体', type: 'box', pos: [0, 1.5, 0], rot: [0, 0, 0], scale: [1.6, 1.6, 1.6],
      color: '#4a9eff', visible: true, spin: 0.6, gravity: 0, vx: 0, vy: 0, vz: 0, bounce: 0.5 },
    { id: uid(), name: '球体', type: 'sphere', pos: [3.5, 1, 0], rot: [0, 0, 0], scale: [1.6, 1.6, 1.6],
      color: '#ff6b6b', visible: true, spin: 0, gravity: 0, vx: 0, vy: 0, vz: 0, bounce: 0.5 },
    { id: uid(), name: '圆环', type: 'torus', pos: [-3.5, 1.4, 0], rot: [0, 0, 0], scale: [1.6, 1.6, 1.6],
      color: '#ffd93d', visible: true, spin: 0.8, gravity: 0, vx: 0, vy: 0, vz: 0, bounce: 0.5 },
    { id: uid(), name: '点光源', type: 'pointLight', pos: [0, 5, 4], rot: [0, 0, 0], scale: [1, 1, 1],
      color: '#ffffff', intensity: 25, visible: true, spin: 0, gravity: 0, vx: 0, vy: 0, vz: 0, bounce: 0.5 }
  ];
}

/* =========================================================
   2D 渲染
   ========================================================= */
const cv = $('#cv2d');
const ctx = cv.getContext('2d');
let CW = 0, CH = 0, DPR = 1;

function resize2d() {
  const r = $('#viewport').getBoundingClientRect();
  DPR = window.devicePixelRatio || 1;
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * DPR);
  cv.height = Math.round(CH * DPR);
  cv.style.width = CW + 'px';
  cv.style.height = CH + 'px';
}

function s2w(sx, sy) {
  const z = state.cam2d.zoom;
  return { x: (sx - CW / 2) / z + state.cam2d.x, y: (sy - CH / 2) / z + state.cam2d.y };
}
function w2s(wx, wy) {
  const z = state.cam2d.zoom;
  return { x: (wx - state.cam2d.x) * z + CW / 2, y: (wy - state.cam2d.y) * z + CH / 2 };
}

function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawGrid() {
  const z = state.cam2d.zoom;
  let step = 50;
  while (step * z < 26) step *= 2;
  while (step * z > 220) step /= 2;

  const hw = CW / 2 / z, hh = CH / 2 / z;
  const x0 = Math.floor((state.cam2d.x - hw) / step) * step;
  const x1 = state.cam2d.x + hw;
  const y0 = Math.floor((state.cam2d.y - hh) / step) * step;
  const y1 = state.cam2d.y + hh;

  ctx.lineWidth = 1 / z;
  ctx.strokeStyle = '#252a34';
  ctx.beginPath();
  for (let x = x0; x <= x1; x += step) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = y0; y <= y1; y += step) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();

  ctx.strokeStyle = '#39424f';
  ctx.beginPath();
  ctx.moveTo(x0, 0); ctx.lineTo(x1, 0);
  ctx.moveTo(0, y0); ctx.lineTo(0, y1);
  ctx.stroke();
}

function drawObj2d(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(d2r(o.rot || 0));
  ctx.fillStyle = o.color || '#4a9eff';

  if (o.type === 'rect') {
    rrect(-o.w / 2, -o.h / 2, o.w, o.h, o.radius || 0);
    ctx.fill();
  } else if (o.type === 'circle') {
    ctx.beginPath();
    ctx.ellipse(0, 0, Math.abs(o.w) / 2, Math.abs(o.h) / 2, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (o.type === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(0, -o.h / 2);
    ctx.lineTo(o.w / 2, o.h / 2);
    ctx.lineTo(-o.w / 2, o.h / 2);
    ctx.closePath();
    ctx.fill();
  } else if (o.type === 'text') {
    ctx.font = `700 ${o.fontSize || 24}px -apple-system, "PingFang SC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(o.text || '文本', 0, 0);
  }
  ctx.restore();
}

function drawSelection2d(o) {
  const z = state.cam2d.zoom;
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(d2r(o.rot || 0));

  ctx.strokeStyle = '#4a9eff';
  ctx.lineWidth = 1.5 / z;
  ctx.setLineDash([6 / z, 4 / z]);
  ctx.strokeRect(-o.w / 2 - 2 / z, -o.h / 2 - 2 / z, o.w + 4 / z, o.h + 4 / z);
  ctx.setLineDash([]);

  // 四角手柄
  const hs = 8 / z;
  ctx.fillStyle = '#4a9eff';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5 / z;
  for (const [px, py] of [[-o.w / 2, -o.h / 2], [o.w / 2, -o.h / 2], [o.w / 2, o.h / 2], [-o.w / 2, o.h / 2]]) {
    ctx.beginPath();
    ctx.rect(px - hs / 2, py - hs / 2, hs, hs);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function draw2d() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1a1d24';
  ctx.fillRect(0, 0, CW, CH);

  ctx.save();
  ctx.translate(CW / 2, CH / 2);
  ctx.scale(state.cam2d.zoom, state.cam2d.zoom);
  ctx.translate(-state.cam2d.x, -state.cam2d.y);

  drawGrid();

  for (const o of state.scenes['2d']) {
    if (o.visible === false) continue;
    drawObj2d(o);
  }

  const sel = getSelected();
  if (sel && !state.playing) drawSelection2d(sel);

  ctx.restore();
}

/* =========================================================
   2D 交互
   ========================================================= */
let drag2d = null;
let spaceDown = false;

function cornerHandles(o) {
  const hw = o.w / 2, hh = o.h / 2;
  const a = d2r(o.rot || 0);
  const ca = Math.cos(a), sa = Math.sin(a);
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([px, py]) => ({
    x: o.x + px * ca - py * sa,
    y: o.y + px * sa + py * ca
  }));
}

function hitHandle(o, sx, sy) {
  const pts = cornerHandles(o);
  for (let i = 0; i < 4; i++) {
    const s = w2s(pts[i].x, pts[i].y);
    if (Math.abs(s.x - sx) < 9 && Math.abs(s.y - sy) < 9) return i;
  }
  return -1;
}

function hitTest2d(wx, wy) {
  const list = state.scenes['2d'];
  for (let i = list.length - 1; i >= 0; i--) {
    const o = list[i];
    if (o.visible === false) continue;
    const dx = wx - o.x, dy = wy - o.y;
    const a = -d2r(o.rot || 0);
    const lx = dx * Math.cos(a) - dy * Math.sin(a);
    const ly = dx * Math.sin(a) + dy * Math.cos(a);
    const hw = Math.abs(o.w) / 2, hh = Math.abs(o.h) / 2;
    if (Math.abs(lx) <= hw && Math.abs(ly) <= hh) return o;
  }
  return null;
}

cv.addEventListener('pointerdown', e => {
  if (state.playing) return;
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const w = s2w(sx, sy);

  if (e.button === 1 || spaceDown) {
    drag2d = { type: 'pan', sx, sy, cx: state.cam2d.x, cy: state.cam2d.y };
    return;
  }
  if (e.button !== 0) return;

  const sel = getSelected();
  if (sel) {
    const hi = hitHandle(sel, sx, sy);
    if (hi >= 0) {
      drag2d = { type: 'resize', h: hi, obj: sel, sw: sel.w, sh: sel.h, sx, sy };
      return;
    }
  }

  const hit = hitTest2d(w.x, w.y);
  if (hit) {
    select(hit.id);
    drag2d = { type: 'move', obj: hit, ox: hit.x, oy: hit.y, sx, sy };
  } else {
    select(null);
    drag2d = { type: 'pan', sx, sy, cx: state.cam2d.x, cy: state.cam2d.y };
  }
});

cv.addEventListener('pointermove', e => {
  if (!drag2d) return;
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const z = state.cam2d.zoom;
  const dx = (sx - drag2d.sx) / z, dy = (sy - drag2d.sy) / z;

  if (drag2d.type === 'pan') {
    state.cam2d.x = drag2d.cx - (sx - drag2d.sx) / z;
    state.cam2d.y = drag2d.cy - (sy - drag2d.sy) / z;
  } else if (drag2d.type === 'move') {
    drag2d.obj.x = drag2d.ox + dx;
    drag2d.obj.y = drag2d.oy + dy;
    markInspectorDirty();
  } else if (drag2d.type === 'resize') {
    const o = drag2d.obj;
    const a = -d2r(o.rot || 0);
    const lx = dx * Math.cos(a) - dy * Math.sin(a);
    const ly = dx * Math.sin(a) + dy * Math.cos(a);
    const dirX = (drag2d.h === 1 || drag2d.h === 2) ? 1 : -1;
    const dirY = (drag2d.h === 2 || drag2d.h === 3) ? 1 : -1;
    o.w = Math.max(6, drag2d.sw + lx * dirX * 2 * 0.5 * 2);
    o.h = Math.max(6, drag2d.sh + ly * dirY * 2 * 0.5 * 2);
    // 简化：直接按局部位移调整
    o.w = Math.max(6, drag2d.sw + lx * dirX * 2);
    o.h = Math.max(6, drag2d.sh + ly * dirY * 2);
    markInspectorDirty();
  }
});

cv.addEventListener('pointerup', e => {
  drag2d = null;
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointercancel', () => { drag2d = null; });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const before = s2w(sx, sy);
  const f = Math.exp(-e.deltaY * 0.0012);
  state.cam2d.zoom = clamp(state.cam2d.zoom * f, 0.08, 10);
  const after = s2w(sx, sy);
  state.cam2d.x += before.x - after.x;
  state.cam2d.y += before.y - after.y;
}, { passive: false });

/* =========================================================
   Three.js 3D
   ========================================================= */
let three3d = null;
let initPromise = null;

function ensure3d() {
  if (!initPromise) initPromise = init3d();
  return initPromise;
}

async function init3d() {
  setStatus('正在加载 Three.js…');
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { TransformControls } = await import('three/addons/controls/TransformControls.js');

  const container = $('#vp3d');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#1a1d24');
  scene.fog = new THREE.Fog('#1a1d24', 30, 80);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
  camera.position.set(9, 7, 12);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2 - 0.02;
  controls.minDistance = 2;
  controls.maxDistance = 80;

  // 灯光
  scene.add(new THREE.HemisphereLight(0xffffff, 0x333a4d, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(8, 14, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -20;
  sun.shadow.camera.right = 20;
  sun.shadow.camera.top = 20;
  sun.shadow.camera.bottom = -20;
  scene.add(sun);

  // 网格
  const grid = new THREE.GridHelper(60, 60, 0x3d4759, 0x262c38);
  grid.position.y = 0.001;
  scene.add(grid);

  // 变换控件
  const tc = new TransformControls(camera, renderer.domElement);
  tc.setSize(0.85);
  tc.addEventListener('dragging-changed', ev => {
    controls.enabled = !ev.value;
  });
  tc.addEventListener('objectChange', () => {
    const o3 = tc.object;
    if (!o3) return;
    const d = o3.userData.data;
    if (!d) return;
    d.pos = [o3.position.x, o3.position.y, o3.position.z];
    d.rot = [r2d(o3.rotation.x), r2d(o3.rotation.y), r2d(o3.rotation.z)];
    d.scale = [o3.scale.x, o3.scale.y, o3.scale.z];
    markInspectorDirty();
  });
  scene.add(tc);

  const byId = new Map();
  const raycaster = new THREE.Raycaster();
  const pickables = [];

  three3d = {
    THREE, renderer, scene, camera, controls, tc, byId, pickables, raycaster,
    container,
    dirty: false
  };

  // 拾取
  let downPos = null;
  renderer.domElement.addEventListener('pointerdown', e => {
    downPos = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!downPos) return;
    const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    downPos = null;
    if (dist > 4 || state.playing || tc.dragging) return;

    const r = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((e.clientX - r.left) / r.width) * 2 - 1,
      -((e.clientY - r.top) / r.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(pickables, true);
    if (hits.length) {
      let n = hits[0].object;
      while (n && !n.userData.dataId) n = n.parent;
      if (n) { select(n.userData.dataId); return; }
    }
    select(null);
  });

  setStatus('Three.js 已就绪');
  return three3d;
}

function resize3d() {
  if (!three3d) return;
  const r = three3d.container.getBoundingClientRect();
  if (r.width < 1 || r.height < 1) return;
  three3d.renderer.setSize(r.width, r.height);
  three3d.camera.aspect = r.width / r.height;
  three3d.camera.updateProjectionMatrix();
}

function makeMat(THREE, color) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: 0.45,
    metalness: 0.12
  });
}

function build3d(o) {
  const T = three3d.THREE;
  const col = new T.Color(o.color || '#4a9eff');
  let obj;

  switch (o.type) {
    case 'box':      obj = new T.Mesh(new T.BoxGeometry(1, 1, 1), makeMat(T, col)); break;
    case 'sphere':   obj = new T.Mesh(new T.SphereGeometry(0.5, 32, 20), makeMat(T, col)); break;
    case 'cylinder': obj = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, 1, 32), makeMat(T, col)); break;
    case 'cone':     obj = new T.Mesh(new T.ConeGeometry(0.5, 1, 32), makeMat(T, col)); break;
    case 'torus':    obj = new T.Mesh(new T.TorusGeometry(0.5, 0.2, 18, 48), makeMat(T, col)); break;
    case 'plane':    obj = new T.Mesh(new T.PlaneGeometry(1, 1), makeMat(T, col)); break;
    case 'pointLight': {
      obj = new T.Group();
      const bulb = new T.Mesh(new T.SphereGeometry(0.16, 16, 12), new T.MeshBasicMaterial({ color: col }));
      const lt = new T.PointLight(col, o.intensity ?? 20, 0, 1.8);
      obj.add(bulb, lt);
      obj.userData.light = lt;
      obj.userData.bulb = bulb;
      break;
    }
    case 'directionalLight': {
      obj = new T.Group();
      const bulb = new T.Mesh(new T.SphereGeometry(0.16, 16, 12), new T.MeshBasicMaterial({ color: col }));
      const lt = new T.DirectionalLight(col, o.intensity ?? 2);
      obj.add(bulb, lt);
      obj.userData.light = lt;
      obj.userData.bulb = bulb;
      break;
    }
    default: obj = new T.Mesh(new T.BoxGeometry(1, 1, 1), makeMat(T, col));
  }

  obj.userData.dataId = o.id;
  obj.userData.data = o;
  if (obj.isMesh) {
    obj.castShadow = o.type !== 'plane';
    obj.receiveShadow = true;
    obj.userData.mainMat = obj.material;
  }
  return obj;
}

function applyTransform3d(o3, o) {
  o3.position.set(o.pos[0], o.pos[1], o.pos[2]);
  o3.rotation.set(d2r(o.rot[0]), d2r(o.rot[1]), d2r(o.rot[2]));
  o3.scale.set(o.scale[0], o.scale[1], o.scale[2]);
  o3.visible = o.visible !== false;
}

function syncScene3d() {
  if (!three3d) return;
  const { scene, byId, pickables, THREE } = three3d;
  const list = state.scenes['3d'];
  const ids = new Set(list.map(o => o.id));

  // 移除
  for (const [id, o3] of [...byId]) {
    if (!ids.has(id)) {
      scene.remove(o3);
      o3.traverse(n => {
        if (n.geometry) n.geometry.dispose();
        if (n.material) n.material.dispose?.();
      });
      byId.delete(id);
      const i = pickables.indexOf(o3);
      if (i >= 0) pickables.splice(i, 1);
      if (three3d.tc.object === o3) three3d.tc.detach();
    }
  }

  // 新增 / 更新
  for (const o of list) {
    let o3 = byId.get(o.id);
    if (!o3) {
      o3 = build3d(o);
      o3.userData.data = o;
      scene.add(o3);
      byId.set(o.id, o3);
      pickables.push(o3);
    }
    applyTransform3d(o3, o);

    // 颜色 / 强度同步
    if (o3.userData.mainMat) o3.userData.mainMat.color.set(o.color);
    if (o3.userData.light) {
      o3.userData.light.color.set(o.color);
      if (o.intensity != null) o3.userData.light.intensity = o.intensity;
    }
    if (o3.userData.bulb) o3.userData.bulb.material.color.set(o.color);
    o3.userData.data = o;
  }
}

function select3d(id) {
  if (!three3d) return;
  const { tc, byId } = three3d;
  if (state.playing || !id) { tc.detach(); return; }
  const o3 = byId.get(id);
  if (o3) {
    tc.attach(o3);
    tc.setMode(state.gizmo);
  } else {
    tc.detach();
  }
}

/* =========================================================
   统一选中
   ========================================================= */
function select(id) {
  state.selectedId = id;
  renderHierarchy();
  renderInspector();
  if (state.mode === '3d') select3d(id);
  updateStatus();
}

/* =========================================================
   物理 / 播放
   ========================================================= */
let snapshot = null;
let playT = 0;

function play() {
  if (state.playing) return;
  snapshot = JSON.parse(JSON.stringify(state.scenes));
  state.playing = true;
  playT = 0;
  $('#playBtn').textContent = '⏸ 运行中';
  if (three3d) three3d.tc.detach();
  setStatus('▶ 运行中…');
}

function stop() {
  if (!state.playing) return;
  state.playing = false;
  if (snapshot) {
    state.scenes = snapshot;
    snapshot = null;
  }
  $('#playBtn').textContent = '▶ 播放';
  if (state.mode === '3d') { syncScene3d(); select3d(state.selectedId); }
  setStatus('■ 已停止，场景已还原');
}

function stepPhysics(dt) {
  if (state.mode === '2d') {
    const FLOOR = 238;
    for (const o of state.scenes['2d']) {
      if (o.visible === false) continue;
      if (o.gravity) o.vy = (o.vy || 0) + o.gravity * dt;
      o.x += (o.vx || 0) * dt;
      o.y += (o.vy || 0) * dt;
      const hh = Math.abs(o.h) / 2;
      if (o.y + hh > FLOOR) {
        o.y = FLOOR - hh;
        o.vy = -o.vy * (o.bounce ?? 0.6);
        if (Math.abs(o.vy) < 18) o.vy = 0;
      }
      if (o.y - hh < -FLOOR) { o.y = -FLOOR + hh; o.vy = Math.abs(o.vy) * (o.bounce ?? 0.6); }
      if (o.x - Math.abs(o.w) / 2 < -400) { o.x = -400 + Math.abs(o.w) / 2; o.vx = Math.abs(o.vx || 0) * (o.bounce ?? 0.6); }
      if (o.x + Math.abs(o.w) / 2 > 400) { o.x = 400 - Math.abs(o.w) / 2; o.vx = -Math.abs(o.vx || 0) * (o.bounce ?? 0.6); }
    }
  } else {
    for (const o of state.scenes['3d']) {
      if (o.visible === false) continue;
      if (o.spin) o.rot[1] += o.spin * 60 * dt;
      if (o.gravity) {
        o.vy = (o.vy || 0) - o.gravity * dt;
        o.pos[1] += o.vy * dt;
        const half = 0.5 * (o.scale[1] || 1);
        if (o.pos[1] < half) {
          o.pos[1] = half;
          o.vy = -o.vy * (o.bounce ?? 0.6);
          if (Math.abs(o.vy) < 0.4) o.vy = 0;
        }
      }
    }
    syncScene3d();
  }
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = performance.now();
let inspectorDirty = false;
function markInspectorDirty() { inspectorDirty = true; }

function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if (state.playing) stepPhysics(dt);

  if (state.mode === '2d') {
    draw2d();
  } else if (three3d) {
    three3d.controls.update();
    three3d.renderer.render(three3d.scene, three3d.camera);
  }

  if (inspectorDirty) {
    inspectorDirty = false;
    if (!els.props.contains(document.activeElement)) renderInspector();
  }
}
requestAnimationFrame(loop);

function renderHierarchy() {
  const ul = $('#objList');

    ul.innerHTML = '<div class="empty" style="padding:20px 8px">空场景</div>';

  for (const o of list) {
    const li = document.createElement('li');

    li.innerHTML = `<span class="ico">${ICONS[o.type] || '▪'}</span>
                    <span class="nm">${esc(o.name)}</span>
                    <span class="eye">${o.visible === false ? '🚫' : '👁'}</span>`;
    li.querySelector('.eye').addEventListener('click', ev => {
      ev.stopPropagation();
      o.visible = o.visible === false;
      if (state.mode === '3d') syncScene3d();
      renderHierarchy();
      renderInspector();
    });
    li.addEventListener('click', () => select(o.id));
    ul.appendChild(li);
  }
}

/* =========================================================
   属性面板
   ========================================================= */
const els = { props: $('#props') };

function rowText(label, value, onInput) {
  const d = document.createElement('div');
  d.className = 'field';
  d.innerHTML = `<label>${esc(label)}</label>`;
  const i = document.createElement('input');
  i.type = 'text';
  i.value = value ?? '';
  i.addEventListener('input', () => onInput(i.value));
  d.appendChild(i);
  return d;
}

function rowNum(label, value, onInput, step = 1) {
  const d = document.createElement('div');
  d.className = 'field';
  d.innerHTML = `<label>${esc(label)}</label>`;
  const i = document.createElement('input');
  i.type = 'number';
  i.step = step;
  i.value = value ?? 0;
  i.addEventListener('input', () => onInput(parseFloat(i.value) || 0));
  d.appendChild(i);
  return d;
}

function rowVec(label, items) {
  const d = document.createElement('div');
  d.className = 'field';
  const lab = document.createElement('label');
  lab.textContent = label;
  d.appendChild(lab);
  const g = document.createElement('div');
  g.className = 'vec-group';
  for (const it of items) {
    const w = document.createElement('div');
    w.className = 'vec-item';
    const s = document.createElement('span');
    s.textContent = it.name;
    const i = document.createElement('input');
    i.type = 'number';
    i.step = it.step ?? 0.1;
    i.value = it.value;
    i.addEventListener('input', () => it.onInput(parseFloat(i.value) || 0));
    w.append(s, i);
    g.appendChild(w);
  }
  d.appendChild(g);
  return d;
}

function rowColor(label, value, onInput) {
  const d = document.createElement('div');
  d.className = 'field';
  d.innerHTML = `<label>${esc(label)}</label>`;
  const r = document.createElement('div');
  r.className = 'color-row';
  const i = document.createElement('input');
  i.type = 'color';
  i.value = value || '#4a9eff';
  const hex = document.createElement('span');
  hex.className = 'hex';
  hex.textContent = i.value;
  i.addEventListener('input', () => { hex.textContent = i.value; onInput(i.value); });
  r.append(i, hex);
  d.appendChild(r);
  return d;
}

function rowCheck(label, value, onInput) {
  const d = document.createElement('div');
  d.className = 'field';
  const r = document.createElement('div');
  r.className = 'check-row';
  const i = document.createElement('input');
  i.type = 'checkbox';
  i.checked = !!value;
  const l = document.createElement('label');
  l.textContent = label;
  l.style.cursor = 'pointer';
  l.addEventListener('click', () => { i.checked = !i.checked; i.dispatchEvent(new Event('change')); });
  i.addEventListener('change', () => onInput(i.checked));
  r.append(i, l);
  d.appendChild(r);
  return d;
}

function groupTitle(text) {
  const d = document.createElement('div');
  d.className = 'group-title';
  d.textContent = text;
  return d;
}

function renderInspector() {
  const p = els.props;
  p.innerHTML = '';
  const o = getSelected();
  if (!o) {
    p.innerHTML = '<div class="empty">未选中对象<br><span style="font-size:11px">点击视口或层级列表选择</span></div>';
    return;
  }

  p.appendChild(rowText('名称', o.name, v => { o.name = v; renderHierarchy(); }));

  if (state.mode === '2d') {
    p.appendChild(groupTitle('变换'));
    p.appendChild(rowVec('位置', [
      { name: 'X', value: o.x, onInput: v => { o.x = v; } },
      { name: 'Y', value: o.y, onInput: v => { o.y = v; } }
    ]));
    p.appendChild(rowVec('尺寸', [
      { name: 'W', value: o.w, onInput: v => { o.w = Math.max(2, v); } },
      { name: 'H', value: o.h, onInput: v => { o.h = Math.max(2, v); } }
    ]));
    p.appendChild(rowNum('旋转 (°)', o.rot || 0, v => { o.rot = v; }, 5));
    if (o.type === 'rect') p.appendChild(rowNum('圆角', o.radius || 0, v => { o.radius = v; }, 1));

    if (o.type === 'text') {
      p.appendChild(groupTitle('文字'));
      p.appendChild(rowText('内容', o.text, v => { o.text = v; o.w = Math.max(20, v.length * (o.fontSize || 24) * 0.6); }));
      p.appendChild(rowNum('字号', o.fontSize || 24, v => {
        o.fontSize = Math.max(6, v);
        o.h = o.fontSize;
        o.w = Math.max(20, (o.text || '').length * o.fontSize * 0.6);
      }, 1));
    }

    p.appendChild(groupTitle('外观'));
    p.appendChild(rowColor('颜色', o.color, v => { o.color = v; }));
    p.appendChild(rowCheck('可见', o.visible !== false, v => { o.visible = v; renderHierarchy(); }));

    p.appendChild(groupTitle('物理'));
    p.appendChild(rowNum('重力 (px/s²)', o.gravity || 0, v => { o.gravity = v; }, 50));
    p.appendChild(rowNum('弹性 (0-1)', o.bounce ?? 0.6, v => { o.bounce = clamp(v, 0, 1.5); }, 0.05));
    p.appendChild(rowVec('初速度', [
      { name: 'VX', value: o.vx || 0, onInput: v => { o.vx = v; } },
      { name: 'VY', value: o.vy || 0, onInput: v => { o.vy = v; } }
    ]));

  } else {
    p.appendChild(groupTitle('变换'));
    p.appendChild(rowVec('位置', [
      { name: 'X', value: o.pos[0], onInput: v => { o.pos[0] = v; syncScene3d(); } },
      { name: 'Y', value: o.pos[1], onInput: v => { o.pos[1] = v; syncScene3d(); } },
      { name: 'Z', value: o.pos[2], onInput: v => { o.pos[2] = v; syncScene3d(); } }
    ]));
    p.appendChild(rowVec('旋转°', [
      { name: 'X', value: o.rot[0], onInput: v => { o.rot[0] = v; syncScene3d(); }, step: 5 },
      { name: 'Y', value: o.rot[1], onInput: v => { o.rot[1] = v; syncScene3d(); }, step: 5 },
      { name: 'Z', value: o.rot[2], onInput: v => { o.rot[2] = v; syncScene3d(); }, step: 5 }
    ]));
    p.appendChild(rowVec('缩放', [
      { name: 'X', value: o.scale[0], onInput: v => { o.scale[0] = v || 0.01; syncScene3d(); } },
      { name: 'Y', value: o.scale[1], onInput: v => { o.scale[1] = v || 0.01; syncScene3d(); } },
      { name: 'Z', value: o.scale[2], onInput: v => { o.scale[2] = v || 0.01; syncScene3d(); } }
    ]));

    p.appendChild(groupTitle('外观'));
    p.appendChild(rowColor('颜色', o.color, v => { o.color = v; syncScene3d(); }));
    if (o.intensity != null) {
      p.appendChild(rowNum('光照强度', o.intensity, v => { o.intensity = Math.max(0, v); syncScene3d(); }, 1));
    }
    p.appendChild(rowCheck('可见', o.visible !== false, v => { o.visible = v; syncScene3d(); renderHierarchy(); }));

    p.appendChild(groupTitle('动画 / 物理'));
    p.appendChild(rowNum('自转速度', o.spin || 0, v => { o.spin = v; }, 0.1));
    p.appendChild(rowNum('重力', o.gravity || 0, v => { o.gravity = v; }, 1));
    p.appendChild(rowNum('弹性', o.bounce ?? 0.6, v => { o.bounce = clamp(v, 0, 1.5); }, 0.05));
  }
}

function addObject(type) {
  let o;
  if (state.mode === '2d') {
    const base = {
      id: uid(), type, x: 0, y: 0, w: 80, h: 80, rot: 0,
      color: '#' + Math.floor(Math.random() * 0x888888 + 0x444444).toString(16).padStart(6, '0'),
      visible: true, vx: 0, vy: 0, gravity: 0, bounce: 0.6
    };
    const names = { rect: '矩形', circle: '圆形', triangle: '三角形', text: '文本' };
    base.name = names[type] || type;
    if (type === 'circle') { base.w = 70; base.h = 70; }
    if (type === 'triangle') { base.w = 80; base.h = 76; }
    if (type === 'rect') { base.radius = 6; base.color = '#4a9eff'; }
    if (type === 'circle') base.color = '#ff6b6b';
    if (type === 'triangle') base.color = '#ffd93d';
    if (type === 'text') {
      base.text = '新文本'; base.fontSize = 28; base.color = '#e8eef8';
      base.w = 120; base.h = 28;
    }
    o = base;
  } else {
    const names = {
      box: '立方体', sphere: '球体', cylinder: '圆柱', cone: '圆锥',
      torus: '圆环', plane: '平面', pointLight: '点光源', directionalLight: '平行光'
    };
    o = {
      id: uid(), name: names[type] || type, type,
      pos: [0, 1, 0], rot: [0, 0, 0], scale: [1.6, 1.6, 1.6],
      color: '#' + Math.floor(Math.random() * 0x888888 + 0x444444).toString(16).padStart(6, '0'),
      visible: true, spin: 0, gravity: 0, vx: 0, vy: 0, vz: 0, bounce: 0.6
    };
    if (type === 'plane') {
      o.rot = [-90, 0, 0]; o.scale = [6, 6, 1]; o.color = '#2f3646'; o.pos = [0, 0, 0];
      o.name = '平面';
    }
    if (type === 'box') o.color = '#4a9eff';
    if (type === 'sphere') o.color = '#ff6b6b';
    if (type === 'torus') o.color = '#ffd93d';
    if (type === 'pointLight' || type === 'directionalLight') {
      o.color = '#ffffff';
      o.intensity = type === 'pointLight' ? 25 : 2;
      o.pos = [0, 4, 2];
      o.scale = [1, 1, 1];
    }
  }

  objs().push(o);
  if (state.mode === '3d') syncScene3d();
  select(o.id);
  toast('已添加：' + o.name);
}

function renderAddButtons() {
  const wrap = $('#addBtns');
  wrap.innerHTML = '';
  const list = state.mode === '2d' ? TYPES_2D : TYPES_3D;
  for (const it of list) {
    const b = document.createElement('button');
    b.textContent = it.n;
    b.addEventListener('click', () => addObject(it.t));
    wrap.appendChild(b);
  }
}

/* =========================================================
   删除 / 复制
   ========================================================= */
function deleteSelected() {
  const o = getSelected();
  if (!o) return;
  const arr = objs();
  arr.splice(arr.indexOf(o), 1);
  state.selectedId = null;
  if (state.mode === '3d') { syncScene3d(); select3d(null); }
  renderHierarchy();
  renderInspector();
  updateStatus();
}

function duplicateSelected() {
  const o = getSelected();
  if (!o) return;
  const c = JSON.parse(JSON.stringify(o));
  c.id = uid();
  c.name = o.name + ' 副本';
  if (state.mode === '2d') { c.x += 24; c.y += 24; }
  else { c.pos[0] += 1.2; c.pos[2] += 1.2; }
  objs().push(c);
  if (state.mode === '3d') syncScene3d();
  select(c.id);
}

/* =========================================================
   模式切换
   ========================================================= */
async function setMode(mode) {
  if (state.mode === mode) return;
  stop();
  state.mode = mode;
  state.selectedId = null;

  $$('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

  if (mode === '3d') {
    cv.style.display = 'none';
    $('#vp3d').style.display = 'block';
    await ensure3d();
    resize3d();
    syncScene3d();
    select3d(null);
  } else {
    cv.style.display = 'block';
    $('#vp3d').style.display = 'none';
    resize2d();
  }

  renderAddButtons();
  renderHierarchy();
  renderInspector();
  updateStatus();
}

/* =========================================================
   状态栏
   ========================================================= */
function setStatus(msg) {
  $('#stHint').textContent = msg;
}

function updateStatus() {
  $('#stMode').innerHTML = '模式：<b>' + (state.mode === '2d' ? '2D 画布' : '3D 场景') + '</b>';
  const o = getSelected();
  $('#stSel').innerHTML = o ? '选中：<b>' + esc(o.name) + '</b>' : '未选中';
  if (state.mode === '2d') {
    $('#stHint').textContent = `缩放 ${(state.cam2d.zoom * 100).toFixed(0)}% · 滚轮缩放 · 空白拖拽平移 · 拖拽对象移动 · Del 删除`;
  } else {
    $('#stHint').textContent = `左键旋转视角 · 右键平移 · 滚轮缩放 · W/E/R 切换 移动/旋转/缩放 · Del 删除`;
  }
}

/* =========================================================
   保存 / 读取
   ========================================================= */
function saveJSON() {
  const data = {
    version: 1,
    mode: state.mode,
    scenes: state.scenes,
    nextId: _id
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'game-scene.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('场景已导出');
}

function loadJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.scenes) throw new Error('格式错误');
      stop();
      state.scenes['2d'] = data.scenes['2d'] || [];
      state.scenes['3d'] = data.scenes['3d'] || [];
      _id = data.nextId || 100;
      state.selectedId = null;
      if (state.mode === '3d') syncScene3d();
      renderHierarchy();
      renderInspector();
      updateStatus();
      toast('场景已导入');
    } catch (e) {
      toast('导入失败：' + e.message);
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   事件绑定
   ========================================================= */
$$('#modeSeg button').forEach(b => {
  b.addEventListener('click', () => setMode(b.dataset.mode));
});

$('#playBtn').addEventListener('click', () => state.playing ? stop() : play());
$('#stopBtn').addEventListener('click', stop);
$('#delBtn').addEventListener('click', deleteSelected);
$('#dupBtn').addEventListener('click', duplicateSelected);
$('#saveBtn').addEventListener('click', saveJSON);
$('#loadBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  if (e.target.files[0]) loadJSON(e.target.files[0]);
  e.target.value = '';
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.code === 'Space') { spaceDown = true; if (state.mode === '2d') cv.style.cursor = 'grab'; }

  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    deleteSelected();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    duplicateSelected();
  }
  if (state.mode === '3d' && three3d) {
    if (e.key.toLowerCase() === 'w') { state.gizmo = 'translate'; three3d.tc.setMode('translate'); }
    if (e.key.toLowerCase() === 'e') { state.gizmo = 'rotate'; three3d.tc.setMode('rotate'); }
    if (e.key.toLowerCase() === 'r') { state.gizmo = 'scale'; three3d.tc.setMode('scale'); }
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceDown = false; if (state.mode === '2d') cv.style.cursor = 'crosshair'; }
});

// 尺寸自适应
const ro = new ResizeObserver(() => {
  if (state.mode === '2d') resize2d();
  else resize3d();
});
ro.observe($('#viewport'));

window.addEventListener('resize', () => {
  if (state.mode === '2d') resize2d();
  else resize3d();
});

/* =========================================================
   启动
   ========================================================= */
seed();
renderAddButtons();
renderHierarchy();
renderInspector();
resize2d();
updateStatus();
setStatus('滚轮缩放 · 空白拖拽平移 · 拖拽对象移动 · Del 删除 · Ctrl+D 复制');
</script>
</body>
</html>
