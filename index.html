<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏编辑器 · 2D / 3D Pro+</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1218; --panel: #161a22; --panel2: #1e232e; --border: #2a3140;
    --text: #d5dae3; --text-dim: #7c8698; --accent: #4a9eff;
    --accent2: #ff6b6b; --accent3: #ffd93d; --accent4: #2ee6a8;
    --enemy: #ff5b5b; --friend: #2ee6a8; --neutral: #9aa7b8;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden; user-select: none;
    touch-action: pan-x pan-y;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  button, a, input, select, textarea {
    touch-action: manipulation;
  }

  #intro {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at 50% 45%, #1a2233 0%, #0a0d13 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: opacity .7s ease, visibility .7s;
  }
  #intro.hide { opacity: 0; visibility: hidden; }
  #intro .logo { font-size: 56px; animation: introPop .9s cubic-bezier(.2,1.4,.4,1) both;
    filter: drop-shadow(0 0 22px rgba(74,158,255,.55)); }
  #intro .title { font-size: 22px; font-weight: 800; letter-spacing: 5px;
    background: linear-gradient(90deg, #4a9eff, #2ee6a8, #ffd93d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: introUp .8s .25s ease both; }
  #intro .sub { font-size: 11px; color: var(--text-dim); letter-spacing: 3px; animation: introUp .8s .45s ease both; }
  #intro .bar { width: 180px; height: 2px; background: #232a36; border-radius: 2px; overflow: hidden; margin-top: 8px; }
  #intro .bar i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #4a9eff, #2ee6a8); animation: introBar 1.5s .3s ease forwards; }
  @keyframes introPop { 0% { transform: scale(.3) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes introUp { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes introBar { 0% { width: 0; } 100% { width: 100%; } }

  #app { display: flex; flex-direction: column; height: 100vh; }

  #toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    min-width: 0;
  }
  .brand { font-weight: 800; font-size: 13px; letter-spacing: .5px; flex-shrink: 0; }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 1px; flex-shrink: 0; }
  .spacer { flex: 1; min-width: 0; }

  #projName {
    background: #0d1016; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 12px;
    font-family: inherit; outline: none; width: 130px; font-weight: 700;
    flex-shrink: 0;
  }
  #projName:focus { border-color: var(--accent); }

  button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 11px; font-size: 12px; font-family: inherit;
    cursor: pointer; transition: all .12s; white-space: nowrap;
    flex-shrink: 0;
  }
  button:hover { background: #2b3140; border-color: #3d4557; }
  button:active { transform: translateY(1px); }
  button.primary { background: #1e6fd9; border-color: #2a7fe8; color: #fff; }
  button.primary:hover { background: #2a7fe8; }
  button.green { background: #1a8f63; border-color: #23a877; color: #fff; }
  button.green:hover { background: #23a877; }
  button.danger { color: #ff8a8a; }
  button.danger:hover { background: #3a2226; border-color: #5a3038; }
  button.mini { padding: 3px 8px; font-size: 11px; }
  button.tiny { padding: 2px 6px; font-size: 10px; }

  .seg { display: flex; background: var(--panel2); border-radius: 7px; padding: 2px; border: 1px solid var(--border); flex-shrink: 0; }
  .seg button { border: none; background: transparent; padding: 5px 14px; border-radius: 5px; font-weight: 700; }
  .seg button.active { background: var(--accent); color: #fff; }

  /* ============ 放置栏：移动端可左右滑动 ============ */
  #addBtnsWrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  #addBtns {
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
    overflow-x: scroll;
    overflow-y: hidden;
    width: 100%;
    padding: 2px 4px 4px 4px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    touch-action: pan-x;
    scrollbar-width: none;
    -ms-overflow-style: none;
    scroll-snap-type: x proximity;
  }
  #addBtns::-webkit-scrollbar { display: none; height: 0; width: 0; }
  #addBtns button {
    padding: 6px 10px;
    font-size: 11.5px;
    scroll-snap-align: start;
    flex: 0 0 auto;
    touch-action: pan-x;
  }
  #addBtnsWrap::before,
  #addBtnsWrap::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 16px;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity .2s;
  }
  #addBtnsWrap::before { left: 0; background: linear-gradient(to right, var(--panel), transparent); }
  #addBtnsWrap::after { right: 0; background: linear-gradient(to left, var(--panel), transparent); }
  #addBtnsWrap.hasLeft::before { opacity: 1; }
  #addBtnsWrap.hasRight::after { opacity: 1; }

  main { flex: 1; display: flex; min-height: 0; }
  aside { background: var(--panel); display: flex; flex-direction: column; flex-shrink: 0; }
  #hierarchy { width: 195px; border-right: 1px solid var(--border); }
  #inspector { width: 300px; border-left: 1px solid var(--border); }

  .panel-title {
    padding: 9px 12px; font-size: 11px; font-weight: 800; letter-spacing: 1px;
    color: var(--text-dim); text-transform: uppercase;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }

  #objList { list-style: none; overflow-y: auto; flex: 1; padding: 4px; }
  #objList li {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12.5px; margin-bottom: 1px;
  }
  #objList li:hover { background: var(--panel2); }
  #objList li.sel { background: #1e4f8f; color: #fff; }
  #objList li .ico { font-size: 12px; opacity: .85; width: 14px; text-align: center; }
  #objList li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #objList li .badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: 800; }
  #objList li .badge.p { background: #2ee6a8; color: #06231a; }
  #objList li .badge.f { background: #2ee6a8; color: #06231a; }
  #objList li .badge.e { background: #ff5b5b; color: #fff; }
  #objList li .badge.n { background: #9aa7b8; color: #111; }
  #objList li .badge.l { background: #ffd93d; color: #332600; }
  #objList li .eye { opacity: .45; font-size: 11px; padding: 0 2px; }
  #objList li .eye:hover { opacity: 1; }

  #viewport { flex: 1; position: relative; min-width: 0; background: #14171e; overflow: hidden; }
  #cv2d { position: absolute; inset: 0; display: block; cursor: crosshair; touch-action: none; }
  #vp3d { position: absolute; inset: 0; display: none; }
  #vp3d canvas { display: block; }
  #playBadge {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(46,230,168,.15); border: 1px solid rgba(46,230,168,.5);
    color: #2ee6a8; padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 700;
    letter-spacing: 1px; display: none; z-index: 5;
  }
  #playBadge.on { display: block; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  #joystick {
    position: absolute; left: 26px; bottom: 26px;
    width: 130px; height: 130px;
    display: none; z-index: 20;
    touch-action: none;
    user-select: none;
  }
  #joystick.on { display: block; }
  #joystick .joy-base {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(74,158,255,.10), rgba(20,30,50,.55));
    border: 2px solid rgba(74,158,255,.55);
    box-shadow: 0 6px 28px rgba(0,0,0,.55), inset 0 0 28px rgba(74,158,255,.14);
    backdrop-filter: blur(6px);
  }
  #joystick .joy-base::after {
    content: '';
    position: absolute; inset: 18px;
    border-radius: 50%;
    border: 1px dashed rgba(74,158,255,.22);
    pointer-events: none;
  }
  #joystick .joy-stick {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #7cc0ff, #2a7fe8 60%, #1a4f9e);
    transform: translate(-50%, -50%);
    box-shadow: 0 6px 18px rgba(42,127,232,.65), inset 0 2px 5px rgba(255,255,255,.35);
    pointer-events: none;
    transition: transform .04s linear;
  }
  #joystick::before {
    content: 'MOVE';
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 2px; font-weight: 800;
    color: rgba(74,158,255,.7); pointer-events: none;
  }

  #props { overflow-y: auto; flex: 1; padding: 10px; }
  .empty { color: var(--text-dim); text-align: center; padding: 30px 10px; font-size: 12px; }
  .field { margin-bottom: 9px; }
  .field > label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-weight: 700; letter-spacing: .3px; }
  .field > label .val { color: var(--accent); font-weight: 800; }
  .field input[type=number], .field input[type=text], .field select {
    width: 100%; background: #0d1016; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none;
  }
  .field select { cursor: pointer; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .vec-group { display: flex; gap: 5px; }
  .vec-item { flex: 1; display: flex; align-items: center; background: #0d1016; border: 1px solid var(--border); border-radius: 5px; padding-left: 6px; min-width: 0; }
  .vec-item span { font-size: 10px; color: var(--text-dim); font-weight: 800; flex-shrink: 0; }
  .vec-item input { border: none !important; background: transparent !important; padding: 5px 4px !important; min-width: 0; }
  .vec-item:focus-within { border-color: var(--accent); }

  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-row input[type=color] { width: 40px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 5px; background: #0d1016; cursor: pointer; }
  .color-row .hex { font-size: 11px; color: var(--text-dim); font-family: monospace; }

  .check-row { display: flex; align-items: center; gap: 8px; }
  .check-row input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .check-row label { font-size: 12px; color: var(--text); cursor: pointer; }

  .group-title {
    font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--text-dim);
    text-transform: uppercase; margin: 16px 0 8px; padding-top: 10px;
    border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
    gap: 6px;
  }
  .group-title:first-child { margin-top: 0; border-top: none; padding-top: 0; }
  .group-title .btns { display: flex; gap: 4px; }

  .tune-panel {
    background: linear-gradient(135deg, #131c2b, #0f1520);
    border: 1px solid #2a3a55; border-radius: 8px;
    padding: 10px; margin-bottom: 6px;
  }
  .tune-panel .tp-title {
    font-size: 10px; letter-spacing: 1.5px; font-weight: 800;
    color: #4a9eff; margin-bottom: 8px; display: flex; justify-content: space-between;
  }
  .tune-panel .tp-title span:last-child { color: var(--text-dim); font-weight: 600; letter-spacing: 0; }
  .tune-slider { margin-bottom: 8px; }
  .tune-slider .ts-head {
    display: flex; justify-content: space-between;
    font-size: 11px; margin-bottom: 3px; color: var(--text);
  }
  .tune-slider .ts-head b { color: var(--accent); font-family: monospace; }
  .tune-presets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tune-presets button {
    padding: 3px 8px; font-size: 10.5px; border-radius: 12px;
    background: #1b2536; border-color: #2a3a55;
  }
  .tune-presets button:hover { background: #26364d; border-color: #3a4f70; }

  .bone-card {
    background: #10141b; border: 1px solid var(--border); border-radius: 7px;
    padding: 8px; margin-bottom: 7px;
  }
  .bone-card .bhead { display: flex; align-items: center; gap: 5px; margin-bottom: 7px; }
  .bone-card .bhead .bdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
  .bone-card .bhead input.bname {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-weight: 700; font-size: 12px; outline: none; padding: 2px 4px;
    border-radius: 3px; min-width: 0;
  }
  .bone-card .bhead input.bname:focus { background: #0d1016; }
  .bone-card .bhead select {
    background: #0d1016; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 4px; font-size: 10px; padding: 2px 4px; cursor: pointer; max-width: 82px;
  }
  .bone-sec { border-top: 1px dashed #1e2735; padding-top: 6px; margin-top: 6px; }
  .bone-sec:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .bone-sec .bs-label {
    font-size: 9px; font-weight: 800; letter-spacing: 1px;
    color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px;
  }
  .slider-row { margin-bottom: 6px; }
  .slider-row .sr-head { display: flex; justify-content: space-between; font-size: 10.5px; margin-bottom: 2px; }
  .slider-row .sr-head span:first-child { color: var(--text-dim); font-weight: 700; }
  .slider-row .sr-head span:last-child { color: var(--accent); font-family: monospace; font-weight: 800; }
  .slider-row input[type=range] {
    width: 100%; height: 4px; accent-color: var(--accent); cursor: pointer;
    background: #1a2029; border-radius: 2px; outline: none;
  }

  .logic-card {
    background: #10141b; border: 1px solid var(--border); border-radius: 7px;
    padding: 8px; margin-bottom: 7px;
    border-left: 3px solid #ffd93d;
  }
  .logic-card.disabled { opacity: .5; border-left-color: #555; }
  .logic-card .lc-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .logic-card .lc-head .lc-idx { font-size: 10px; font-weight: 800; color: #ffd93d; letter-spacing: 1px; }
  .logic-card .lc-head .lc-spacer { flex: 1; }
  .logic-card .lc-row { margin-bottom: 5px; }
  .logic-card .lc-row label { display: block; font-size: 10px; color: var(--text-dim); font-weight: 700; margin-bottom: 2px; }
  .logic-card .lc-row select,
  .logic-card .lc-row input {
    width: 100%; background: #0d1016; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 6px; font-size: 11px; font-family: inherit; outline: none;
  }
  .logic-card .lc-row select:focus,
  .logic-card .lc-row input:focus { border-color: #ffd93d; }

  .hp-bar { height: 8px; background: #1a1f28; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .hp-bar i { display: block; height: 100%; transition: width .2s; }

  #statusbar {
    padding: 5px 14px; background: var(--panel); border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-dim); display: flex; gap: 18px; flex-shrink: 0;
    align-items: center;
  }
  #statusbar b { color: var(--text); font-weight: 700; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333b4a; border-radius: 5px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: #445067; }

  .toast {
    position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: #2a7fe8; color: #fff; padding: 9px 22px; border-radius: 20px;
    font-size: 12.5px; pointer-events: none; opacity: 0; transition: all .25s; z-index: 99999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 99998;
    display: none; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal-mask.on { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; width: 640px; max-width: 100%; max-height: 88vh;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
  }
  .modal h3 { font-size: 14px; margin-bottom: 10px; flex-shrink: 0; }
  .modal textarea {
    width: 100%; height: 170px; background: #0d1016; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font-family: monospace; font-size: 11px; resize: vertical; outline: none;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-shrink: 0; }

  /* ============ 资源库 ============ */
  .asset-toolbar {
    display: flex; gap: 8px; margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .asset-toolbar input {
    flex: 1; background: #0d1016; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 6px 10px; font-size: 12px; font-family: inherit; outline: none;
  }
  .asset-toolbar input:focus { border-color: var(--accent); }

  .asset-list {
    flex: 1; overflow-y: auto; min-height: 120px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; padding: 2px;
  }
  .asset-empty {
    grid-column: 1 / -1;
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 12px; line-height: 1.8;
  }
  .asset-empty .ico { font-size: 40px; display: block; margin-bottom: 8px; opacity: .6; }

  .asset-card {
    background: #10141b; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px; cursor: pointer; transition: all .15s; position: relative;
    overflow: hidden;
  }
  .asset-card:hover { border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(74,158,255,.15); }
  .asset-card:active { transform: translateY(0); }
  .asset-card .ac-canvas {
    width: 100%; height: 64px; border-radius: 5px;
    background: #0a0d13; display: block; margin-bottom: 7px;
  }
  .asset-card .ac-name {
    font-size: 12px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .asset-card .ac-meta {
    font-size: 10px; color: var(--text-dim); margin-top: 2px;
    display: flex; gap: 6px; align-items: center;
  }
  .asset-card .ac-mode {
    background: #1b2536; color: #4a9eff; padding: 1px 5px;
    border-radius: 3px; font-weight: 800; font-size: 9px;
  }
  .asset-card .ac-mode.m3d { color: #ffd93d; }
  .asset-card .ac-del {
    position: absolute; top: 6px; right: 6px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,91,91,.9); color: #fff; border: none;
    font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
    opacity: 0; transition: opacity .15s;
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
  }
  .asset-card:hover .ac-del { opacity: 1; }
  .asset-card .ac-del:hover { background: #ff5b5b; }

  /* 响应式 */
  @media (max-width: 900px) {
    #hierarchy { width: 160px; }
    #inspector { width: 260px; }
    #projName { width: 100px; }
  }
  @media (max-width: 640px) {
    #hierarchy { display: none; }
    .brand { font-size: 12px; }
    #projName { width: 90px; font-size: 11px; }
    #toolbar { gap: 4px; padding: 6px 8px; }
    #toolbar button { padding: 6px 8px; font-size: 11px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro">
  <div class="logo">🎮</div>
  <div class="title">GAME EDITOR</div>
  <div class="sub">ASSETS · SCROLL · PLAY</div>
  <div class="bar"><i></i></div>
</div>

<div id="app">
  <header id="toolbar">
    <div class="brand">🎮 <span>Game</span></div>

<script type="module">
/* =========================================================
   禁止缩放（移动端 + 桌面）
   ========================================================= */
['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
  document.addEventListener(evt, e => e.preventDefault(), { passive: false });
});
window.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) e.preventDefault();
}, { passive: false, capture: true });
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].includes(e.key)) {
    e.preventDefault();
  }
}, { passive: false });

/* =========================================================
   工具
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let _id = 1;
const uid = () => 'o' + (_id++);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const d2r = d => d * Math.PI / 180;
const r2d = r => r * 180 / Math.PI;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const FACTION_COLOR = { friend: '#2ee6a8', enemy: '#ff5b5b', neutral: '#9aa7b8' };
const fmt = (v, digits = 2) => {
  const n = Number(v) || 0;
  return n.toFixed(digits).replace(/\.?0+$/, '') || '0';
};

function toast(msg, ms = 1700) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), ms);
}

function download(content, filename, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function toB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* =========================================================
   音效
   ========================================================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
const SFX_DEF = {
  jump:      ['square',   180,  520, 0.14],
  hit:       ['sawtooth', 260,   70, 0.16],
  coin:      ['sine',     880, 1400, 0.22],
  laser:     ['sawtooth',1400,  220, 0.20],
  explosion: ['sawtooth', 140,   40, 0.50],
  beep:      ['sine',     440,  440, 0.10],
  powerup:   ['triangle', 330,  990, 0.30]
};
function sfx(type, vol = 0.3) {
  if (!audioCtx || !type || type === 'none') return;
  const cfg = SFX_DEF[type] || SFX_DEF.beep;
  const v = Math.max(0.01, Math.min(1, vol));
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = cfg[0];
  o.frequency.setValueAtTime(cfg[1], t);
  if (cfg[1] !== cfg[2]) o.frequency.exponentialRampToValueAtTime(cfg[2], t + cfg[3] * 0.8);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + cfg[3]);
  o.start(t); o.stop(t + cfg[3] + 0.02);
}
const sfxThrottle = {};
function sfxT(key, type, vol) {
  const now = performance.now();
  if (sfxThrottle[key] && now - sfxThrottle[key] < 90) return;
  sfxThrottle[key] = now;
  sfx(type, vol);
}

    { id: 'b3', name: '右臂', parent: 0,  ox: 28, oy: -10, oz: 0, rx: 0, ry: 0, rz: -18, sx: 13, sy: 32, sz: 13, color: '#4a9eff' },
    { id: 'b4', name: '左腿', parent: 0,  ox: -12, oy: 30, oz: 0, rx: 0, ry: 0, rz: 0, sx: 14, sy: 34, sz: 14, color: '#3a6fb0' },
    { id: 'b5', name: '右腿', parent: 0,  ox: 12, oy: 30, oz: 0, rx: 0, ry: 0, rz: 0, sx: 14, sy: 34, sz: 14, color: '#3a6fb0' }

/* =========================================================
   全局状态
   ========================================================= */
const state = {
  projectName: '我的游戏工程',
  mode: '2d',
  selectedId: null,
  playing: false,
  scenes: { '2d': [], '3d': [] },
  cam2d: { x: 0, y: 0, zoom: 1 },

};

/* =========================================================
   资源库
   ========================================================= */
const AssetLib = {
  KEY: 'game_editor_assets_v1',
  list: [],
  load() {
    try {
      const s = localStorage.getItem(this.KEY);
      this.list = s ? JSON.parse(s) : [];
      if (!Array.isArray(this.list)) this.list = [];
    } catch (e) { this.list = []; }
  },
  persist() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.list));
      return true;
    } catch (e) {
      toast('保存失败：' + (e.message || '存储空间不足'));
      return false;
    }
  },
  add(name, mode, srcObj) {
    const clean = JSON.parse(JSON.stringify(srcObj));
    // 清理运行时字段
    delete clean.id;
    delete clean._dead;
    delete clean._jumping;
    delete clean._boneVersion;
    delete clean._textVersion;
    delete clean._bindRot;
    delete clean._bindRotX;
    delete clean._bindRotY;
    delete clean._bindRotZ;
    delete clean._hitFlash;
    if (clean.logic) for (const r of clean.logic) { delete r._fired; delete r._timer; }
    // 解绑父级（避免引用丢失）
    clean.bindParent = null;

    const a = {
      id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: (name || srcObj.name || '资源').slice(0, 40),
      mode: mode,
      type: srcObj.type,
      color: srcObj.color || '#4a9eff',
      data: clean,
      createdAt: Date.now()
    };
    this.list.unshift(a);
    // 最多保留 200 个
    if (this.list.length > 200) this.list.length = 200;
    return this.persist();
  },
  remove(id) {
    const i = this.list.findIndex(x => x.id === id);
    if (i >= 0) { this.list.splice(i, 1); return this.persist(); }
    return false;
  },
  get(id) { return this.list.find(x => x.id === id); },
  clear() { this.list = []; return this.persist(); }
};

const TYPE_ICONS = {
  rect: '▭', circle: '●', triangle: '▲', text: 'T',
  box: '⬛', sphere: '⚪', cylinder: '⬤', cone: '▲', torus: '◎', plane: '▬',
  pointLight: '💡', directionalLight: '☀', camera3d: '🎥', creature: '🧬', text3d: 'T'
};

/* 绘制资源缩略图 */
function drawAssetThumb(canvas, asset) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 130;
  const h = canvas.clientHeight || 64;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);

  // 背景渐变
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#161e2b');
  g.addColorStop(1, '#0a0d13');
  c.fillStyle = g;
  c.fillRect(0, 0, w, h);

  const o = asset.data;
  const cx = w / 2, cy = h / 2;

  if (asset.mode === '2d') {
    // 2D 预览
    c.save();
    c.translate(cx, cy);
    const fitScale = Math.min(w / 120, h / 80, 1);
    c.scale(fitScale, fitScale);
    c.fillStyle = o.color || '#4a9eff';
    c.shadowColor = o.color || '#4a9eff';
    c.shadowBlur = 12;
    if (o.type === 'rect') {
      const rw = Math.min(80, Math.max(20, Math.abs(o.w || 60)));
      const rh = Math.min(50, Math.max(16, Math.abs(o.h || 60)));
      roundRect(c, -rw / 2, -rh / 2, rw, rh, o.radius || 4);
      c.fill();
    } else if (o.type === 'circle') {
      c.beginPath();
      c.ellipse(0, 0, 26, 22, 0, 0, Math.PI * 2);
      c.fill();
    } else if (o.type === 'triangle') {
      c.beginPath();
      c.moveTo(0, -22);
      c.lineTo(24, 20);
      c.lineTo(-24, 20);
      c.closePath();
      c.fill();
    } else if (o.type === 'text') {
      c.shadowBlur = 10;
      c.font = 'bold 20px -apple-system, "PingFang SC", sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText((o.text || 'T').slice(0, 3), 0, 0);
    } else if (o.type === 'creature') {
      // 简化骨骼预览
      c.shadowBlur = 8;
      c.fillStyle = o.color || '#ff5b5b';
      c.fillRect(-7, -10, 14, 20);
      c.fillStyle = '#ffd93d';
      c.beginPath();
      c.arc(0, -16, 5, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = o.color || '#ff5b5b';
      c.fillRect(-13, -6, 4, 12);
      c.fillRect(9, -6, 4, 12);
    }
    c.restore();
  } else {
    // 3D 预览
    c.save();
    // 画一个 3D 透视的小方块背景
    c.strokeStyle = 'rgba(74,158,255,.15)';
    c.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      c.beginPath();
      c.moveTo(0, h * i / 4);
      c.lineTo(w, h * i / 4);
      c.stroke();
    }
    c.restore();

    // 图标 + 颜色
    c.save();
    c.translate(cx, cy);
    c.font = '30px -apple-system, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.shadowColor = asset.color || '#4a9eff';
    c.shadowBlur = 16;
    c.fillStyle = asset.color || '#4a9eff';
    const ico = TYPE_ICONS[asset.type] || '▪';
    c.fillText(ico, 0, 0);
    c.restore();

    // 类型角标
    c.fillStyle = 'rgba(255,217,61,.85)';
    c.font = 'bold 8px sans-serif';
    c.textAlign = 'right';
    c.fillText('3D', w - 6, 12);
  }
}

function roundRect(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  c.beginPath();
  if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function renderAssetList() {
  const list = $('#assetList');
  list.innerHTML = '';

  if (!AssetLib.list.length) {
    list.innerHTML = `<div class="asset-empty">
      <span class="ico">📦</span>
      资源库是空的<br>
      <span style="font-size:11px">选中一个对象后点上方「保存当前选中」</span>
    </div>`;
    return;
  }

  for (const a of AssetLib.list) {
    const card = document.createElement('div');
    card.className = 'asset-card';

    const canvas = document.createElement('canvas');
    canvas.className = 'ac-canvas';
    card.appendChild(canvas);

    const nameEl = document.createElement('div');
    nameEl.className = 'ac-name';
    nameEl.textContent = a.name;
    nameEl.title = a.name;
    card.appendChild(nameEl);

    const metaEl = document.createElement('div');
    metaEl.className = 'ac-meta';
    metaEl.innerHTML = `<span class="ac-mode${a.mode === '3d' ? ' m3d' : ''}">${a.mode.toUpperCase()}</span><span>${(TYPE_ICONS[a.type] || '▪')} ${esc(a.type)}</span>`;
    card.appendChild(metaEl);

    const delBtn = document.createElement('button');
    delBtn.className = 'ac-del';
    delBtn.textContent = '×';
    delBtn.title = '删除资源';
    delBtn.addEventListener('click', ev => {
      ev.stopPropagation();
      if (!confirm('删除资源「' + a.name + '」？')) return;
      AssetLib.remove(a.id);
      renderAssetList();
      toast('已删除资源');
    });
    card.appendChild(delBtn);

    // 点击卡片 → 添加资源到场景
    card.addEventListener('click', () => {
      useAsset(a);
    });

    list.appendChild(card);
    // 渲染缩略图（需要先加入 DOM 获取尺寸）
    requestAnimationFrame(() => drawAssetThumb(canvas, a));
  }
}

function useAsset(asset) {
  if (asset.mode !== state.mode) {
    toast(`该资源属于 ${asset.mode.toUpperCase()} 模式，请先切换到 ${asset.mode.toUpperCase()}`);
    return;
  }
  const obj = JSON.parse(JSON.stringify(asset.data));
  obj.id = uid();
  // 避免与场景内已有对象 id 冲突
  if (!obj.bindParent) obj.bindParent = null;
  if (!obj.logic) obj.logic = [];
  if (!obj.sound) obj.sound = { enabled: false, type: 'hit', volume: 0.3 };
  if (state.mode === '2d' && !obj.bindOffset) obj.bindOffset = [0, 0];
  if (state.mode === '3d' && !obj.bindOffset) obj.bindOffset = [0, 0, 0];
  if (state.mode === '3d' && !obj.path) obj.path = { enabled: false, points: [], speed: 1, mode: 'loop' };
  if (obj.type === 'creature' && !obj.bones) obj.bones = defaultBones();
  if (obj.type === 'text3d') obj._textVersion = 0;

  // 稍微偏移避免完全重叠
  if (state.mode === '2d') {
    obj.x = (obj.x || 0) + 30;
    obj.y = (obj.y || 0) + 30;
  } else {
    obj.pos = (obj.pos || [0, 1.5, 0]).slice();
    obj.pos[0] += 1.2;
    obj.pos[2] += 1.2;
  }

  objs().push(obj);
  if (state.mode === '3d') syncScene3d();
  select(obj.id);
  toast('已添加资源：' + asset.name);
}

function saveCurrentAsAsset() {
  const o = getSelected();
  if (!o) return toast('请先选中一个对象');

  const input = $('#assetName');
  const name = (input.value || o.name || '资源').trim() || '资源';
  if (AssetLib.add(name, state.mode, o)) {
    input.value = '';
    renderAssetList();
    toast('已保存资源：' + name);
  }
}

/* =========================================================
   移动轮盘
   ========================================================= */
const joy = { active: false, pointerId: null, dx: 0, dy: 0, el: null, stickEl: null };
let joyShown = false;

function setupJoystick() {
  const el = document.getElementById('joystick');
  if (!el) return;
  joy.el = el;
  joy.stickEl = el.querySelector('.joy-stick');

  function updateFromEvent(e) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const mr = r.width / 2 - 10;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > mr) { dx = dx / len * mr; dy = dy / len * mr; }
    joy.dx = dx / mr;
    joy.dy = dy / mr;
    joy.stickEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  el.addEventListener('pointerdown', e => {
    if (!state.playing) return;
    e.preventDefault(); e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    joy.pointerId = e.pointerId;
    joy.active = true;
    updateFromEvent(e);
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== joy.pointerId || !joy.active) return;
    e.preventDefault();
    updateFromEvent(e);
  });
  const endJoy = e => {
    if (e.pointerId !== joy.pointerId) return;
    joy.active = false;
    joy.pointerId = null;
    joy.dx = 0; joy.dy = 0;
    if (joy.stickEl) joy.stickEl.style.transform = 'translate(-50%, -50%)';
  };
  el.addEventListener('pointerup', endJoy);
  el.addEventListener('pointercancel', endJoy);
}

function updateJoystickVisibility() {
  if (!joy.el) return;
  const player = objs().find(o => o.isPlayer && !o._dead && o.visible !== false && o.controllable !== false);
  const show = state.playing && !!player;
  if (show !== joyShown) {
    joyShown = show;
    joy.el.classList.toggle('on', show);
  }
}

/* =========================================================
   粒子系统
   ========================================================= */
const Particles = {
  list: [],
  spawn2d(x, y, cfg) {
    const n = cfg.count ?? 18;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (cfg.speed ?? 180) * (0.5 + Math.random());
      this.list.push({
        x, y, z: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (cfg.speed ?? 180) * 0.3, vz: 0,
        life: (cfg.life ?? 0.8) * (0.6 + Math.random() * 0.7), maxLife: cfg.life ?? 0.8,
        color: cfg.color || '#ffd93d', size: (cfg.size ?? 4) * (0.5 + Math.random()),
        gravity: cfg.gravity ?? 400
      });
    }
  },
  spawn3d(pos, cfg) {
    const n = cfg.count ?? 24;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const b = Math.random() * Math.PI - Math.PI / 2;
      const sp = (cfg.speed ?? 4) * (0.5 + Math.random());
      this.list.push({
        x: pos[0], y: pos[1], z: pos[2],
        vx: Math.cos(a) * Math.cos(b) * sp,
        vy: Math.sin(b) * sp + sp * 0.4,
        vz: Math.sin(a) * Math.cos(b) * sp,
        life: (cfg.life ?? 1.0) * (0.6 + Math.random() * 0.7), maxLife: cfg.life ?? 1.0,
        color: cfg.color || '#ffd93d', size: (cfg.size ?? 0.15) * (0.5 + Math.random()),
        gravity: cfg.gravity ?? 8, is3d: true
      });
    }
  },
  update(dt) {
    const is3d = state.mode === '3d';
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt;
      if (p.life <= 0) { this.list.splice(i, 1); continue; }
      p.vy -= p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (is3d && p.y < 0.05) { p.y = 0.05; p.vy *= -0.4; p.vx *= 0.8; p.vz *= 0.8; }
    }
  },
  draw2d(ctx) {
    for (const p of this.list) {
      if (p.is3d) continue;
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
  clear() { this.list.length = 0; }
};

/* =========================================================
   2D 渲染
   ========================================================= */
const cv = $('#cv2d');
const ctx = cv.getContext('2d');
let CW = 0, CH = 0, DPR = 1;

function resize2d() {
  const r = $('#viewport').getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * DPR);
  cv.height = Math.round(CH * DPR);
  cv.style.width = CW + 'px';
  cv.style.height = CH + 'px';
}
function s2w(sx, sy) {
  const z = state.cam2d.zoom;
  return { x: (sx - CW / 2) / z + state.cam2d.x, y: (sy - CH / 2) / z + state.cam2d.y };
}
function w2s(wx, wy) {
  const z = state.cam2d.zoom;
  return { x: (wx - state.cam2d.x) * z + CW / 2, y: (wy - state.cam2d.y) * z + CH / 2 };
}
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function drawGrid() {
  const z = state.cam2d.zoom;
  let step = 50;
  while (step * z < 26) step *= 2;
  while (step * z > 220) step /= 2;
  const hw = CW / 2 / z, hh = CH / 2 / z;
  const x0 = Math.floor((state.cam2d.x - hw) / step) * step;
  const x1 = state.cam2d.x + hw;
  const y0 = Math.floor((state.cam2d.y - hh) / step) * step;
  const y1 = state.cam2d.y + hh;
  ctx.lineWidth = 1 / z;
  ctx.strokeStyle = '#20252f';
  ctx.beginPath();
  for (let x = x0; x <= x1; x += step) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = y0; y <= y1; y += step) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  ctx.strokeStyle = '#37404f';
  ctx.beginPath();
  ctx.moveTo(x0, 0); ctx.lineTo(x1, 0);
  ctx.moveTo(0, y0); ctx.lineTo(0, y1);
  ctx.stroke();
}
function drawCreatureBones2d(o) {
  const bones = o.bones && o.bones.length ? o.bones : defaultBones();
  const drawBone = (i) => {
    const b = bones[i];
    if (!b) return;
    ctx.save();
    ctx.translate(b.ox || 0, b.oy || 0);
    ctx.rotate(d2r(b.rz || 0));
    ctx.fillStyle = b.color || o.color;
    const w = b.sx || 20, h = b.sy || 20;
    rrect(-w / 2, -h / 2, w, h, Math.min(w, h) * 0.22);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
    for (let j = 0; j < bones.length; j++) {
      if (bones[j].parent === i) drawBone(j);
    }
    ctx.restore();
  };
  for (let i = 0; i < bones.length; i++) {
    if (bones[i].parent === -1 || bones[i].parent == null) drawBone(i);
  }
}
function drawHPBar2d(o, x, y) {
  const w = 46, h = 5;
  const ratio = clamp((o.hp ?? 1) / (o.maxHp || 1), 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(x - w / 2, y, w, h);
  ctx.fillStyle = FACTION_COLOR[o.faction] || '#ff5b5b';
  ctx.fillRect(x - w / 2, y, w * ratio, h);
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 0.8;
  ctx.strokeRect(x - w / 2, y, w, h);
}
function drawObj2d(o) {
  if (o._dead) return;
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(d2r(o.rot || 0));
  ctx.fillStyle = o.color || '#4a9eff';
  if (o.type === 'creature') {
    drawCreatureBones2d(o);
  } else if (o.type === 'rect') {
    rrect(-o.w / 2, -o.h / 2, o.w, o.h, o.radius || 0);
    ctx.fill();
  } else if (o.type === 'circle') {
    ctx.beginPath();
    ctx.ellipse(0, 0, Math.abs(o.w) / 2, Math.abs(o.h) / 2, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (o.type === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(0, -o.h / 2);
    ctx.lineTo(o.w / 2, o.h / 2);
    ctx.lineTo(-o.w / 2, o.h / 2);
    ctx.closePath();
    ctx.fill();
  } else if (o.type === 'text') {
    ctx.font = `800 ${o.fontSize || 24}px -apple-system, "PingFang SC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(o.text || '文本', 0, 0);
  }
  ctx.restore();

  if (o.type === 'creature') {
    const top = o.y - (o.h || 80) / 2 - 4;
    drawHPBar2d(o, o.x, top - 10);
    ctx.save();
    ctx.font = '700 9px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = FACTION_COLOR[o.faction] || '#fff';
    ctx.fillText((o.stateName || '状态') + ' · ' + (o.hp ?? 0) + '/' + (o.maxHp ?? 0), o.x, top - 14);
    ctx.restore();
  }

  if (o.isPlayer) {
    ctx.save();
    ctx.translate(o.x, o.y - Math.abs(o.h) / 2 - 16);
    ctx.fillStyle = '#2ee6a8';
    ctx.beginPath();
    ctx.moveTo(0, 6); ctx.lineTo(-6, -3); ctx.lineTo(6, -3);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  if (o.bindParent) {
    const p = state.scenes['2d'].find(x => x.id === o.bindParent);
    if (p) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,217,61,.45)';
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(o.x, o.y);
      ctx.stroke();
      ctx.restore();
    }
  }
}
function drawSelection2d(o) {
  const z = state.cam2d.zoom;
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(d2r(o.rot || 0));
  ctx.strokeStyle = '#4a9eff';
  ctx.lineWidth = 1.5 / z;
  ctx.setLineDash([6 / z, 4 / z]);
  ctx.strokeRect(-o.w / 2 - 2 / z, -o.h / 2 - 2 / z, o.w + 4 / z, o.h + 4 / z);
  ctx.setLineDash([]);
  const hs = 8 / z;
  ctx.fillStyle = '#4a9eff';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5 / z;
  for (const [px, py] of [[-o.w / 2, -o.h / 2], [o.w / 2, -o.h / 2], [o.w / 2, o.h / 2], [-o.w / 2, o.h / 2]]) {
    ctx.beginPath(); ctx.rect(px - hs / 2, py - hs / 2, hs, hs); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function draw2d() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#14171e';
  ctx.fillRect(0, 0, CW, CH);
  ctx.save();
  ctx.translate(CW / 2, CH / 2);
  ctx.scale(state.cam2d.zoom, state.cam2d.zoom);
  ctx.translate(-state.cam2d.x, -state.cam2d.y);
  drawGrid();
  for (const o of state.scenes['2d']) {
    if (o.visible === false) continue;
    drawObj2d(o);
  }
  Particles.draw2d(ctx);
  const sel = getSelected();
  if (sel && !state.playing) drawSelection2d(sel);
  ctx.restore();
}

/* =========================================================
   2D 交互
   ========================================================= */
let drag2d = null;
let spaceDown = false;

function cornerHandles(o) {
  const hw = o.w / 2, hh = o.h / 2;
  const a = d2r(o.rot || 0);
  const ca = Math.cos(a), sa = Math.sin(a);
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([px, py]) => ({
    x: o.x + px * ca - py * sa,
    y: o.y + px * sa + py * ca
  }));
}
function hitHandle(o, sx, sy) {
  const pts = cornerHandles(o);
  for (let i = 0; i < 4; i++) {
    const s = w2s(pts[i].x, pts[i].y);
    if (Math.abs(s.x - sx) < 9 && Math.abs(s.y - sy) < 9) return i;
  }
  return -1;
}
function hitTest2d(wx, wy) {
  const list = state.scenes['2d'];
  for (let i = list.length - 1; i >= 0; i--) {
    const o = list[i];
    if (o.visible === false || o._dead) continue;
    const dx = wx - o.x, dy = wy - o.y;
    const a = -d2r(o.rot || 0);
    const lx = dx * Math.cos(a) - dy * Math.sin(a);
    const ly = dx * Math.sin(a) + dy * Math.cos(a);
    if (Math.abs(lx) <= Math.abs(o.w) / 2 && Math.abs(ly) <= Math.abs(o.h) / 2) return o;
  }
  return null;
}

cv.addEventListener('pointerdown', e => {
  if (state.playing) return;
  cv.setPointerCapture(e.pointerId);
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const w = s2w(sx, sy);
  if (e.button === 1 || spaceDown) {
    drag2d = { type: 'pan', sx, sy, cx: state.cam2d.x, cy: state.cam2d.y };
    return;
  }
  if (e.button !== 0) return;
  const sel = getSelected();
  if (sel) {
    const hi = hitHandle(sel, sx, sy);
    if (hi >= 0) { drag2d = { type: 'resize', h: hi, obj: sel, sw: sel.w, sh: sel.h, sx, sy }; return; }
  }
  const hit = hitTest2d(w.x, w.y);
  if (hit) {
    select(hit.id);
    drag2d = { type: 'move', obj: hit, ox: hit.x, oy: hit.y, sx, sy };
  } else {
    select(null);
    drag2d = { type: 'pan', sx, sy, cx: state.cam2d.x, cy: state.cam2d.y };
  }
});
cv.addEventListener('pointermove', e => {
  if (!drag2d) return;
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const z = state.cam2d.zoom;
  const dx = (sx - drag2d.sx) / z, dy = (sy - drag2d.sy) / z;
  if (drag2d.type === 'pan') {
    state.cam2d.x = drag2d.cx - (sx - drag2d.sx) / z;
    state.cam2d.y = drag2d.cy - (sy - drag2d.sy) / z;
  } else if (drag2d.type === 'move') {
    drag2d.obj.x = drag2d.ox + dx;
    drag2d.obj.y = drag2d.oy + dy;
    markInspectorDirty();
  } else if (drag2d.type === 'resize') {
    const o = drag2d.obj;
    const a = -d2r(o.rot || 0);
    const lx = dx * Math.cos(a) - dy * Math.sin(a);
    const ly = dx * Math.sin(a) + dy * Math.cos(a);
    const dirX = (drag2d.h === 1 || drag2d.h === 2) ? 1 : -1;
    const dirY = (drag2d.h === 2 || drag2d.h === 3) ? 1 : -1;
    o.w = Math.max(6, drag2d.sw + lx * dirX * 2);
    o.h = Math.max(6, drag2d.sh + ly * dirY * 2);
    markInspectorDirty();
  }
});
cv.addEventListener('pointerup', e => {
  drag2d = null;
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointercancel', () => { drag2d = null; });
cv.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const before = s2w(sx, sy);
  const f = Math.exp(-e.deltaY * 0.0012);
  state.cam2d.zoom = clamp(state.cam2d.zoom * f, 0.08, 10);
  const after = s2w(sx, sy);
  state.cam2d.x += before.x - after.x;
  state.cam2d.y += before.y - after.y;
}, { passive: false });

/* =========================================================
   Three.js 3D
   ========================================================= */
let three3d = null, initPromise = null;
let particles3dPoints = null;

function ensure3d() {
  if (!initPromise) initPromise = init3d();
  return initPromise;
}

async function init3d() {
  setHint('正在加载 Three.js…');
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { TransformControls } = await import('three/addons/controls/TransformControls.js');

  const container = $('#vp3d');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#14171e');
  scene.fog = new THREE.Fog('#14171e', 32, 90);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 3000);
  camera.position.set(10, 8, 13);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2 - 0.02;
  controls.minDistance = 2;
  controls.maxDistance = 120;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3140, 1.15));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(9, 16, 9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22 });
  scene.add(sun);

  const grid = new THREE.GridHelper(80, 80, 0x3d4759, 0x242a35);
  grid.position.y = 0.002;
  scene.add(grid);

  const tc = new TransformControls(camera, renderer.domElement);
  tc.setSize(0.85);
  tc.addEventListener('dragging-changed', ev => { controls.enabled = !ev.value; });
  tc.addEventListener('objectChange', () => {
    const o3 = tc.object;
    if (!o3) return;
    const d = o3.userData.data;
    if (!d) return;
    d.pos = [o3.position.x, o3.position.y, o3.position.z];
    d.rot = [r2d(o3.rotation.x), r2d(o3.rotation.y), r2d(o3.rotation.z)];
    d.scale = [o3.scale.x, o3.scale.y, o3.scale.z];
    markInspectorDirty();
  });
  scene.add(tc);

  const pathGroup = new THREE.Group();
  scene.add(pathGroup);

  const byId = new Map();
  const raycaster = new THREE.Raycaster();
  const pickables = [];

  const ptGeo = new THREE.BufferGeometry();
  const MAXP = 2000;
  ptGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXP * 3), 3));
  ptGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAXP * 3), 3));
  const ptMat = new THREE.PointsMaterial({ size: 0.16, vertexColors: true, transparent: true, opacity: 0.95, sizeAttenuation: true });
  particles3dPoints = new THREE.Points(ptGeo, ptMat);
  particles3dPoints.frustumCulled = false;
  scene.add(particles3dPoints);

  three3d = { THREE, renderer, scene, camera, controls, tc, byId, pickables, raycaster, container, pathGroup, ptGeo, MAXP, dirty: false };

  let downPos = null;
  renderer.domElement.addEventListener('pointerdown', e => { downPos = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!downPos) return;
    const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
    downPos = null;
    if (dist > 4 || state.playing || tc.dragging) return;
    const r = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((e.clientX - r.left) / r.width) * 2 - 1,
      -((e.clientY - r.top) / r.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(pickables, true);
    if (hits.length) {
      let n = hits[0].object;
      while (n && !n.userData.dataId) n = n.parent;
      if (n) { select(n.userData.dataId); return; }
    }
    select(null);
  });

  setHint('Three.js 已就绪');
  return three3d;
}

function resize3d() {
  if (!three3d) return;
  const r = three3d.container.getBoundingClientRect();
  if (r.width < 1 || r.height < 1) return;
  three3d.renderer.setSize(r.width, r.height);
  three3d.camera.aspect = r.width / r.height;
  three3d.camera.updateProjectionMatrix();
}

function makeMat(T, color) {
  return new T.MeshStandardMaterial({ color: new T.Color(color), roughness: 0.45, metalness: 0.12 });
}

function buildText3d(o) {
  const T = three3d.THREE;
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 256;
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, canvas.width, canvas.height);
  const size = Math.min(200, o.fontSize || 128);
  c.font = `bold ${size}px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillStyle = o.color || '#e8eef8';
  c.shadowColor = o.color || '#e8eef8';
  c.shadowBlur = 22;
  c.fillText(o.text || '文本', canvas.width / 2, canvas.height / 2);
  const tex = new T.CanvasTexture(canvas);
  tex.colorSpace = T.SRGBColorSpace;
  tex.needsUpdate = true;
  const mat = new T.MeshBasicMaterial({ map: tex, transparent: true, side: T.DoubleSide, depthWrite: false });
  const geo = new T.PlaneGeometry(2 * (canvas.width / canvas.height), 2);
  const mesh = new T.Mesh(geo, mat);
  mesh.userData.isText3d = true;
  return mesh;
}

function buildCreature3d(o) {
  const T = three3d.THREE;
  const bones = o.bones && o.bones.length ? o.bones : defaultBones();
  const group = new T.Group();
  const buildBone = (i) => {
    const b = bones[i];
    if (!b) return null;
    const g = new T.Group();
    g.position.set(b.ox || 0, b.oy || 0, b.oz || 0);
    g.rotation.set(d2r(b.rx || 0), d2r(b.ry || 0), d2r(b.rz || 0));
    const geo = new T.BoxGeometry(1, 1, 1);
    const mat = new T.MeshStandardMaterial({ color: new T.Color(b.color || o.color), roughness: 0.5, metalness: 0.1 });
    const mesh = new T.Mesh(geo, mat);
    mesh.scale.set(b.sx || 20, b.sy || 20, b.sz || (b.sx || 20));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
    for (let j = 0; j < bones.length; j++) {
      if (bones[j].parent === i) {
        const c = buildBone(j);
        if (c) g.add(c);
      }
    }
    return g;
  };
  for (let i = 0; i < bones.length; i++) {
    if (bones[i].parent === -1 || bones[i].parent == null) {
      const root = buildBone(i);
      if (root) group.add(root);
    }
  }
  return group;
}

function build3d(o) {
  const T = three3d.THREE;
  const col = new T.Color(o.color || '#4a9eff');
  let obj;
  switch (o.type) {
    case 'box':       obj = new T.Mesh(new T.BoxGeometry(1, 1, 1), makeMat(T, col)); break;
    case 'sphere':    obj = new T.Mesh(new T.SphereGeometry(0.5, 32, 20), makeMat(T, col)); break;
    case 'cylinder':  obj = new T.Mesh(new T.CylinderGeometry(0.5, 0.5, 1, 32), makeMat(T, col)); break;
    case 'cone':      obj = new T.Mesh(new T.ConeGeometry(0.5, 1, 32), makeMat(T, col)); break;
    case 'torus':     obj = new T.Mesh(new T.TorusGeometry(0.5, 0.2, 18, 48), makeMat(T, col)); break;
    case 'plane':     obj = new T.Mesh(new T.PlaneGeometry(1, 1), makeMat(T, col)); break;
    case 'creature':  obj = buildCreature3d(o); break;
    case 'text3d':    obj = buildText3d(o); break;
    case 'pointLight': {
      obj = new T.Group();
      const bulb = new T.Mesh(new T.SphereGeometry(0.16, 16, 12), new T.MeshBasicMaterial({ color: col }));
      const lt = new T.PointLight(col, o.intensity ?? 20, 0, 1.8);
      obj.add(bulb, lt);
      obj.userData.light = lt; obj.userData.bulb = bulb;
      break;
    }
    case 'directionalLight': {
      obj = new T.Group();
      const bulb = new T.Mesh(new T.SphereGeometry(0.16, 16, 12), new T.MeshBasicMaterial({ color: col }));
      const lt = new T.DirectionalLight(col, o.intensity ?? 2);
      obj.add(bulb, lt);
      obj.userData.light = lt; obj.userData.bulb = bulb;
      break;
    }
    case 'camera3d': {
      obj = new T.Group();
      const body = new T.Mesh(new T.BoxGeometry(0.8, 0.5, 0.9),
        new T.MeshBasicMaterial({ color: col, wireframe: true }));
      const lens = new T.Mesh(new T.ConeGeometry(0.42, 0.7, 4),
        new T.MeshBasicMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.5 }));
      lens.rotation.x = -Math.PI / 2;
      lens.position.z = -0.75;
      obj.add(body, lens);
      break;
    }
    default: obj = new T.Mesh(new T.BoxGeometry(1, 1, 1), makeMat(T, col));
  }
  obj.userData.dataId = o.id;
  obj.userData.data = o;
  obj.userData.boneVer = o._boneVersion || 0;
  obj.userData.textVer = o._textVersion || 0;
  if (obj.isMesh && o.type !== 'text3d') {
    obj.castShadow = o.type !== 'plane';
    obj.receiveShadow = true;
    obj.userData.mainMat = obj.material;
  }
  return obj;
}

function applyTransform3d(o3, o) {
  o3.position.set(o.pos[0], o.pos[1], o.pos[2]);
  o3.rotation.set(d2r(o.rot[0]), d2r(o.rot[1]), d2r(o.rot[2]));
  o3.scale.set(o.scale[0], o.scale[1], o.scale[2]);
  o3.visible = o.visible !== false && !o._dead;
}

function disposeObj3d(obj) {
  obj.traverse(n => {
    if (n.geometry) n.geometry.dispose();
    if (n.material) {
      if (Array.isArray(n.material)) n.material.forEach(m => m.dispose());
      else {
        if (n.material.map) n.material.map.dispose();
        n.material.dispose();
      }
    }
  });
}

function syncScene3d() {
  if (!three3d) return;
  const { scene, byId, pickables, pathGroup, THREE: T, tc } = three3d;
  const list = state.scenes['3d'];
  const ids = new Set(list.map(o => o.id));

  for (const [id, o3] of [...byId]) {
    if (!ids.has(id)) {
      scene.remove(o3);
      disposeObj3d(o3);
      byId.delete(id);
      const i = pickables.indexOf(o3);
      if (i >= 0) pickables.splice(i, 1);
      if (tc.object === o3) tc.detach();
    }
  }

  for (const o of list) {
    let o3 = byId.get(o.id);
    if (o3 && o.type === 'creature' && o3.userData.boneVer !== (o._boneVersion || 0)) {
      scene.remove(o3); disposeObj3d(o3);
      const i = pickables.indexOf(o3); if (i >= 0) pickables.splice(i, 1);
      if (tc.object === o3) tc.detach();
      byId.delete(o.id); o3 = null;
    }
    if (o3 && o.type === 'text3d' && o3.userData.textVer !== (o._textVersion || 0)) {
      scene.remove(o3); disposeObj3d(o3);
      const i = pickables.indexOf(o3); if (i >= 0) pickables.splice(i, 1);
      if (tc.object === o3) tc.detach();
      byId.delete(o.id); o3 = null;
    }
    if (!o3) {
      o3 = build3d(o);
      scene.add(o3);
      byId.set(o.id, o3);
      pickables.push(o3);
      if (o.type === 'creature') o3.userData.boneVer = o._boneVersion || 0;
      if (o.type === 'text3d') o3.userData.textVer = o._textVersion || 0;
    }
    applyTransform3d(o3, o);

    if (o.type === 'creature') {
      const bones = o.bones && o.bones.length ? o.bones : [];
      let idx = 0;
      o3.traverse(n => {
        if (n.isMesh && bones[idx]) {
          n.material.color.set(bones[idx].color || o.color);
          idx++;
        }
      });
    } else if (o3.userData.mainMat) {
      o3.userData.mainMat.color.set(o.color);
    }
    if (o3.userData.light) {
      o3.userData.light.color.set(o.color);
      if (o.intensity != null) o3.userData.light.intensity = o.intensity;
    }
    if (o3.userData.bulb) o3.userData.bulb.material.color.set(o.color);
    o3.userData.data = o;
  }

  while (pathGroup.children.length) {
    const c = pathGroup.children.pop();
    c.geometry?.dispose();
    c.material?.dispose();
  }
  const sel = getSelected();
  for (const o of list) {
    if (!o.path?.enabled || !o.path.points || o.path.points.length < 2) continue;
    if (o.id !== sel?.id && !state.playing) continue;
    const pts = o.path.points.map(p => new T.Vector3(p[0], p[1], p[2]));
    if (o.path.mode === 'loop') pts.push(pts[0].clone());
    const geo = new T.BufferGeometry().setFromPoints(pts);
    const mat = new T.LineDashedMaterial({ color: 0x4a9eff, dashSize: 0.35, gapSize: 0.22, transparent: true, opacity: 0.9 });
    const line = new T.Line(geo, mat);
    line.computeLineDistances();
    pathGroup.add(line);
    for (const p of o.path.points) {
      const m = new T.Mesh(new T.SphereGeometry(0.13, 12, 10), new T.MeshBasicMaterial({ color: 0xffd93d }));
      m.position.set(p[0], p[1], p[2]);
      pathGroup.add(m);
    }
  }
}

function select3d(id) {
  if (!three3d) return;
  const { tc, byId } = three3d;
  if (state.playing || !id) { tc.detach(); return; }
  const o3 = byId.get(id);
  if (o3) { tc.attach(o3); tc.setMode(state.gizmo); }
  else tc.detach();
}

function update3dParticles() {
  if (!three3d || !particles3dPoints) return;
  const { ptGeo, MAXP } = three3d;
  const posArr = ptGeo.attributes.position.array;
  const colArr = ptGeo.attributes.color.array;
  const items = Particles.list.filter(p => p.is3d);
  const n = Math.min(items.length, MAXP);
  const tmpC = new three3d.THREE.Color();
  for (let i = 0; i < n; i++) {
    const p = items[i];
    posArr[i * 3] = p.x;
    posArr[i * 3 + 1] = p.y;
    posArr[i * 3 + 2] = p.z;
    tmpC.set(p.color);
    const a = Math.max(0, p.life / p.maxLife);
    colArr[i * 3] = tmpC.r * a;
    colArr[i * 3 + 1] = tmpC.g * a;
    colArr[i * 3 + 2] = tmpC.b * a;
  }
  for (let i = n; i < MAXP; i++) {
    posArr[i * 3] = 0; posArr[i * 3 + 1] = -9999; posArr[i * 3 + 2] = 0;
    colArr[i * 3] = 0; colArr[i * 3 + 1] = 0; colArr[i * 3 + 2] = 0;
  }
  ptGeo.attributes.position.needsUpdate = true;
  ptGeo.attributes.color.needsUpdate = true;
  particles3dPoints.visible = n > 0;
}

/* =========================================================
   选中
   ========================================================= */
function select(id) {
  state.selectedId = id;
  renderHierarchy();
  renderInspector();
  if (state.mode === '3d') { select3d(id); syncScene3d(); }
  updateStatus();
}

/* =========================================================
   播放 / 物理
   ========================================================= */
let snapshot = null;
let playBackupCam = null;

function resetLogicState() {
  const list = state.scenes[state.mode] || [];
  for (const o of list) {
    if (o.logic) for (const r of o.logic) { r._fired = false; r._timer = 0; }
    o._jumping = false;
    o._dead = false;
  }
}

function play() {
  if (state.playing) return;
  ensureAudio();
  snapshot = JSON.parse(JSON.stringify(state.scenes));
  playBackupCam = { ...state.cam2d };
  state.playing = true;
  Particles.clear();
  resetLogicState();

  const list = state.scenes[state.mode];
  for (const o of list) {
    if (o.sound?.enabled && o.sound.trigger === 'start') sfx(o.sound.type, o.sound.volume);
  }

  $('#playBtn').textContent = '⏸ 运行中';
  $('#playBadge').classList.add('on');
  if (three3d) { three3d.tc.detach(); three3d.controls.enabled = false; }

  if (state.mode === '2d') {
    const p = state.scenes['2d'].find(o => o.isPlayer);
    if (p) { state.cam2d.x = p.x; state.cam2d.y = p.y; }
  }
  updateJoystickVisibility();
  setHint('▶ 运行中 · 拖动轮盘移动玩家');
}

function stop() {
  if (!state.playing) return;
  state.playing = false;
  if (snapshot) { state.scenes = snapshot; snapshot = null; }
  if (playBackupCam) { state.cam2d = playBackupCam; playBackupCam = null; }
  Particles.clear();
  joy.active = false;
  joy.pointerId = null;
  joy.dx = 0; joy.dy = 0;
  if (joy.stickEl) joy.stickEl.style.transform = 'translate(-50%, -50%)';
  $('#playBtn').textContent = '▶ 播放';
  $('#playBadge').classList.remove('on');
  if (three3d) {
    three3d.controls.enabled = true;
    syncScene3d();
    select3d(state.selectedId);
  }
  updateJoystickVisibility();
  renderHierarchy();
  renderInspector();
  updateStatus();
}

function damage(obj, amount) {
  if (obj._dead) return;
  const def = obj.defense || 0;
  const dmg = Math.max(1, amount - def * 0.5);
  obj.hp = Math.max(0, (obj.hp ?? 10) - dmg);
  obj._hitFlash = 0.15;
  if (obj.sound?.enabled) sfx(obj.sound.type, obj.sound.volume);
  if (obj.hp <= 0) destroyObj(obj);
}

function destroyObj(o) {
  if (o._dead) return;
  o._dead = true;
  o.visible = false;
  if (o.particles?.enabled) {
    const cfg = o.particles;
    if (state.mode === '2d') Particles.spawn2d(o.x, o.y, cfg);
    else Particles.spawn3d(o.pos, cfg);
    if (cfg.sound) sfx('explosion', 0.35);
  }
}

function rectsOverlap2d(a, b) {
  const ahw = Math.abs(a.w) / 2, ahh = Math.abs(a.h) / 2;
  const bhw = Math.abs(b.w) / 2, bhh = Math.abs(b.h) / 2;
  return Math.abs(b.x - a.x) < ahw + bhw && Math.abs(b.y - a.y) < ahh + bhh;
}
function bbox3(o) {
  const s = o.scale, p = o.pos;
  return {
    min: [p[0] - s[0] / 2, p[1] - s[1] / 2, p[2] - s[2] / 2],
    max: [p[0] + s[0] / 2, p[1] + s[1] / 2, p[2] + s[2] / 2]
  };
}
function boxesOverlap3d(a, b) {
  const A = bbox3(a), B = bbox3(b);
  return A.min[0] < B.max[0] && A.max[0] > B.min[0] &&
         A.min[1] < B.max[1] && A.max[1] > B.min[1] &&
         A.min[2] < B.max[2] && A.max[2] > B.min[2];
}

function executeAction(owner, target, rule) {
  const action = rule.action || 'sound';
  const amount = rule.amount || 0;
  const snd = rule.sound || 'hit';

  switch (action) {
    case 'destroy_self': destroyObj(owner); break;
    case 'destroy_target': if (target) destroyObj(target); break;
    case 'damage_self': damage(owner, amount || 5); break;
    case 'damage_target': if (target) damage(target, amount || 5); break;
    case 'heal_self':
      owner.hp = Math.min(owner.maxHp || 100, (owner.hp || 0) + (amount || 10));
      break;
    case 'heal_target':
      if (target) target.hp = Math.min(target.maxHp || 100, (target.hp || 0) + (amount || 10));
      break;
    case 'push_target':
      if (target) {
        if (state.mode === '2d') {
          const dx = target.x - owner.x, dy = target.y - owner.y;
          const len = Math.hypot(dx, dy) || 1;
          target.vx = (dx / len) * (amount || 300);
          target.vy = (dy / len) * (amount || 300) - 120;
        } else {
          const dx = target.pos[0] - owner.pos[0];
          const dz = target.pos[2] - owner.pos[2];
          const len = Math.hypot(dx, dz) || 1;
          target.vx = (dx / len) * (amount || 6);
          target.vz = (dz / len) * (amount || 6);
          target.vy = 3;
        }
      }
      break;
    case 'teleport_self':
      if (target) {
        if (state.mode === '2d') { owner.x = target.x; owner.y = target.y - 60; }
        else { owner.pos = [target.pos[0], target.pos[1] + 2, target.pos[2]]; }
      }
      break;
    case 'particle':
      if (state.mode === '2d') {
        Particles.spawn2d(owner.x, owner.y, { count: 15, color: owner.color || '#ffd93d', speed: 220, life: 0.7 });
      } else {
        Particles.spawn3d(owner.pos, { count: 18, color: owner.color || '#ffd93d', speed: 3.5, life: 0.8 });
      }
      break;
    case 'sound': default:
      sfx(snd, 0.32);
      break;
  }
}

function checkLogic(dt) {
  if (!state.playing) return;
  const arr = state.scenes[state.mode];

  for (const o of arr) {
    if (o._dead || o.visible === false) continue;
    if (!o.logic || !o.logic.length) continue;

    for (const rule of o.logic) {
      if (rule.enabled === false) continue;
      if (rule.once && rule._fired) continue;

      let fired = false;

      if (rule.trigger === 'collide') {
        const target = rule.targetId ? arr.find(x => x.id === rule.targetId) : null;
        const candidates = target ? [target] : arr;
        for (const t of candidates) {
          if (!t || t === o || t._dead || t.visible === false) continue;
          let hit;
          if (state.mode === '2d') hit = rectsOverlap2d(o, t);
          else hit = boxesOverlap3d(o, t);
          if (hit) {
            executeAction(o, t, rule);
            fired = true;
            break;
          }
        }
      } else if (rule.trigger === 'keypress') {
        const k = (rule.key || 'e').toLowerCase();
        if (keysDown[k]) {
          executeAction(o, null, rule);
          fired = true;
        }
      } else if (rule.trigger === 'interval') {
        rule._timer = (rule._timer || 0) + dt;
        if (rule._timer >= (rule.interval || 1)) {
          rule._timer = 0;
          executeAction(o, null, rule);
          fired = true;
        }
      }

      if (fired && rule.once) rule._fired = true;
    }
  }
}

function step2d(dt) {
  const arr = state.scenes['2d'];
  const FLOOR = 240, WALL = 460;
  const snd = [];

  for (const o of arr) {
    if (o.isPlayer && o.controllable !== false && joy.active) {
      const spd = o.moveSpeed ?? 320;
      if (Math.abs(joy.dx) > 0.08) o.vx = joy.dx * spd;
      if (!o.gravity) {
        o.vy = joy.dy * spd;
      } else if (joy.dy < -0.55) {
        if (!o._jumping) {
          o.vy = -(o.jumpPower ?? 560);
          o._jumping = true;
          if (o.sound?.enabled) sfx('jump', o.sound.volume);
        }
      }
    }
    if (o.isPlayer && (!joy.active || joy.dy > -0.35)) o._jumping = false;
  }

  for (const o of arr) {
    if (o.visible === false || o._dead) continue;
    if (o.bindParent) continue;
    if (o.gravity) o.vy = (o.vy || 0) + o.gravity * dt;
    o.x += (o.vx || 0) * dt;
    o.y += (o.vy || 0) * dt;
  }

  for (const o of arr) {
    if (o.visible === false || o._dead || o.bindParent) continue;
    const hw = Math.abs(o.w) / 2, hh = Math.abs(o.h) / 2;
    let hit = false;
    if (o.y + hh > FLOOR) {
      o.y = FLOOR - hh;
      if (Math.abs(o.vy) > 90) hit = true;
      o.vy = -o.vy * (o.bounce ?? 0.6);
      if (Math.abs(o.vy) < 28) o.vy = 0;
    }
    if (o.y - hh < -FLOOR) { o.y = -FLOOR + hh; o.vy = Math.abs(o.vy) * (o.bounce ?? 0.6); }
    if (o.x - hw < -WALL) { o.x = -WALL + hw; o.vx = Math.abs(o.vx || 0) * (o.bounce ?? 0.6); if (Math.abs(o.vx) > 90) hit = true; }
    if (o.x + hw > WALL) { o.x = WALL - hw; o.vx = -Math.abs(o.vx || 0) * (o.bounce ?? 0.6); if (Math.abs(o.vx) > 90) hit = true; }
    if (hit && o.sound?.enabled) snd.push([o.sound, 'b' + o.id]);
  }

  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j];
      if (a.visible === false || b.visible === false || a._dead || b._dead) continue;
      if (!a.collide && !b.collide) continue;
      const ahw = Math.abs(a.w) / 2, ahh = Math.abs(a.h) / 2;
      const bhw = Math.abs(b.w) / 2, bhh = Math.abs(b.h) / 2;
      const dx = b.x - a.x, dy = b.y - a.y;
      const ox = (ahw + bhw) - Math.abs(dx);
      const oy = (ahh + bhh) - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;

      if (a.type === 'creature' && b.type === 'creature' && a.faction !== b.faction) {
        if (!a._cd || performance.now() - a._cd > 500) { damage(a, b.attack || 5); a._cd = performance.now(); }
        if (!b._cd || performance.now() - b._cd > 500) { damage(b, a.attack || 5); b._cd = performance.now(); }
      }

      const aStatic = !a.gravity && !a.vx && !a.vy;
      const bStatic = !b.gravity && !b.vx && !b.vy;
      if (aStatic && bStatic) continue;
      let ap = 0.5, bp = 0.5;
      if (aStatic) { ap = 0; bp = 1; }
      else if (bStatic) { ap = 1; bp = 0; }

      if (ox < oy) {
        const s = dx < 0 ? -1 : 1;
        a.x -= s * ox * ap; b.x += s * ox * bp;
        if (ap > 0) { const v = a.vx || 0; a.vx = -v * (a.bounce ?? 0.5); if (Math.abs(v) > 90 && a.sound?.enabled) snd.push([a.sound, 'cx' + a.id]); }
        if (bp > 0) { const v = b.vx || 0; b.vx = -v * (b.bounce ?? 0.5); if (Math.abs(v) > 90 && b.sound?.enabled) snd.push([b.sound, 'cx' + b.id]); }
      } else {
        const s = dy < 0 ? -1 : 1;
        a.y -= s * oy * ap; b.y += s * oy * bp;
        if (ap > 0) { const v = a.vy || 0; a.vy = -v * (a.bounce ?? 0.5); if (Math.abs(v) > 90 && a.sound?.enabled) snd.push([a.sound, 'cy' + a.id]); }
        if (bp > 0) { const v = b.vy || 0; b.vy = -v * (b.bounce ?? 0.5); if (Math.abs(v) > 90 && b.sound?.enabled) snd.push([b.sound, 'cy' + b.id]); }
      }
    }
  }

  for (const o of arr) {
    if (!o.bindParent || o._dead) continue;
    const p = arr.find(x => x.id === o.bindParent);
    if (p) {
      const off = o.bindOffset || [0, 0];
      o.x = p.x + off[0];
      o.y = p.y + off[1];
      o.rot = (p.rot || 0) + (o._bindRot || 0);
      o.vx = 0; o.vy = 0;
    }
  }

  for (const [s, k] of snd) sfxT(k, s.type, s.volume);

  const p = arr.find(o => o.isPlayer && !o._dead);
  if (p) {
    const k = 1 - Math.exp(-5 * dt);
    state.cam2d.x += (p.x - state.cam2d.x) * k;
    state.cam2d.y += (p.y - state.cam2d.y) * k;
  }
}

function step3d(dt) {
  const arr = state.scenes['3d'];
  const snd = [];

  if (joy.active && three3d) {
    const p = arr.find(o => o.isPlayer && o.controllable !== false && !o._dead);
    if (p) {
      const T = three3d.THREE;
      const camDir = new T.Vector3();
      three3d.camera.getWorldDirection(camDir);
      camDir.y = 0;
      if (camDir.lengthSq() > 0.001) camDir.normalize();
      const camRight = new T.Vector3().crossVectors(camDir, new T.Vector3(0, 1, 0)).normalize();
      const mv = new T.Vector3();
      mv.addScaledVector(camDir, -joy.dy);
      mv.addScaledVector(camRight, joy.dx);
      if (mv.lengthSq() > 0.001) mv.normalize();
      const spd = p.moveSpeed ?? 7;
      p.pos[0] += mv.x * spd * dt;
      p.pos[2] += mv.z * spd * dt;
    }
  }

  for (const o of arr) {
    if (o.visible === false || o._dead) continue;
    if (o.bindParent) continue;

    if (o.path?.enabled && o.path.points?.length >= 2) {
      o.path._t = (o.path._t || 0) + dt * (o.path.speed || 1);
      const pts = o.path.points, n = pts.length;
      const md = o.path.mode || 'loop';
      if (md === 'loop') {
        const t = ((o.path._t % n) + n) % n;
        const seg = Math.floor(t), f = t - seg;
        o.pos = lerp3(pts[seg], pts[(seg + 1) % n], f);
      } else if (md === 'pingpong') {
        const total = (n - 1) * 2;
        const t = ((o.path._t % total) + total) % total;
        const tt = t <= n - 1 ? t : total - t;
        const seg = Math.min(Math.floor(tt), n - 2), f = tt - seg;
        o.pos = lerp3(pts[seg], pts[seg + 1], f);
      } else {
        const t = Math.min(o.path._t, n - 1);
        const seg = Math.min(Math.floor(t), n - 2), f = t - seg;
        o.pos = lerp3(pts[seg], pts[seg + 1], f);
        if (o.path._t >= n - 1) o.path._t = n - 1;
      }
    }

    if (o.spin) o.rot[1] += o.spin * 60 * dt;

    if (o.gravity) {
      o.vy = (o.vy || 0) - o.gravity * dt;
      o.pos[1] += o.vy * dt;
      const half = (o.scale[1] || 1) * 0.5;
      if (o.pos[1] < half) {
        o.pos[1] = half;
        if (Math.abs(o.vy) > 1.6 && o.sound?.enabled) snd.push([o.sound, 'b' + o.id]);
        o.vy = -o.vy * (o.bounce ?? 0.6);
        if (Math.abs(o.vy) < 0.7) o.vy = 0;
      }
    }
  }

  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j];
      if (a.visible === false || b.visible === false || a._dead || b._dead) continue;
      if (!a.collide && !b.collide) continue;
      if (/Light|camera3d/.test(a.type) || /Light|camera3d/.test(b.type)) continue;
      const A = bbox3(a), B = bbox3(b);
      const ox = Math.min(A.max[0], B.max[0]) - Math.max(A.min[0], B.min[0]);
      const oy = Math.min(A.max[1], B.max[1]) - Math.max(A.min[1], B.min[1]);
      const oz = Math.min(A.max[2], B.max[2]) - Math.max(A.min[2], B.min[2]);
      if (ox <= 0 || oy <= 0 || oz <= 0) continue;

      if (a.type === 'creature' && b.type === 'creature' && a.faction !== b.faction) {
        if (!a._cd || performance.now() - a._cd > 500) { damage(a, b.attack || 5); a._cd = performance.now(); }
        if (!b._cd || performance.now() - b._cd > 500) { damage(b, a.attack || 5); b._cd = performance.now(); }
      }

      let axis = 0, ov = ox;
      if (oy < ov) { axis = 1; ov = oy; }
      if (oz < ov) { axis = 2; ov = oz; }

      const dir = (b.pos[axis] - a.pos[axis]) >= 0 ? 1 : -1;
      const aStatic = !a.gravity && !a.vy;
      const bStatic = !b.gravity && !b.vy;
      let ap = 0.5, bp = 0.5;
      if (aStatic && !bStatic) { ap = 0; bp = 1; }
      else if (!aStatic && bStatic) { ap = 1; bp = 0; }

      a.pos[axis] -= dir * ov * ap;
      b.pos[axis] += dir * ov * bp;

      if (axis === 1) {
        if (ap > 0) { a.vy = -Math.abs(a.vy || 0) * (a.bounce ?? 0.5); if (Math.abs(a.vy) > 1.5 && a.sound?.enabled) snd.push([a.sound, 'cy' + a.id]); }
        if (bp > 0) { b.vy = Math.abs(b.vy || 0) * (b.bounce ?? 0.5); if (Math.abs(b.vy) > 1.5 && b.sound?.enabled) snd.push([b.sound, 'cy' + b.id]); }
      }
    }
  }

  for (const o of arr) {
    if (!o.bindParent || o._dead) continue;
    const p = arr.find(x => x.id === o.bindParent);
    if (p) {
      const off = o.bindOffset || [0, 0, 0];
      o.pos = [p.pos[0] + off[0], p.pos[1] + off[1], p.pos[2] + off[2]];
      o.rot = [(p.rot[0] || 0) + (o._bindRotX || 0), (p.rot[1] || 0) + (o._bindRotY || 0), (p.rot[2] || 0) + (o._bindRotZ || 0)];
      o.vx = o.vy = o.vz = 0;
    }
  }

  for (const [s, k] of snd) sfxT(k, s.type, s.volume);

  syncScene3d();

  const p = arr.find(o => o.isPlayer && !o._dead);
  if (p && three3d) {
    const T = three3d.THREE;
    const target = new T.Vector3(p.pos[0], p.pos[1], p.pos[2]);
    const desired = target.clone().add(new T.Vector3(0, 2.6, 7));
    const k = 1 - Math.exp(-4 * dt);
    three3d.camera.position.lerp(desired, k);
    three3d.camera.lookAt(target);
  } else if (three3d) {
    const camObj = arr.find(o => o.type === 'camera3d' && o.visible !== false);
    if (camObj) {
      const T = three3d.THREE;
      three3d.camera.position.set(camObj.pos[0], camObj.pos[1], camObj.pos[2]);
      three3d.camera.rotation.set(d2r(camObj.rot[0]), d2r(camObj.rot[1]), d2r(camObj.rot[2]));
    }
  }
}

function stepPhysics(dt) {
  if (state.mode === '2d') step2d(dt);
  else step3d(dt);
  checkLogic(dt);
  Particles.update(dt);
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = performance.now();
let inspectorDirty = false;
function markInspectorDirty() { inspectorDirty = true; }

function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if (state.playing) {
    stepPhysics(dt);
    updateJoystickVisibility();
  } else if (Particles.list.length) {
    Particles.update(dt);
  }

  if (state.mode === '2d') {
    draw2d();
  } else if (three3d) {
    update3dParticles();
    if (!state.playing) three3d.controls.update();
    three3d.renderer.render(three3d.scene, three3d.camera);
  }

  if (inspectorDirty) {
    inspectorDirty = false;
    if (!els.props.contains(document.activeElement)) renderInspector();
  }
}
requestAnimationFrame(loop);
