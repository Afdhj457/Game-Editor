  let rafId = null;
  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    valSpan.textContent = fmt(v, digits) + suffix;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => onChange(v));
  });
  row.appendChild(inp);
  return row;
}

function renderBonesEditor(o) {
  const container = el('div', 'bone-block');
  if (!o.bones || !o.bones.length) {
    o.bones = defaultBones();
    o._boneVersion = (o._boneVersion || 0) + 1;
  }
  const bones = o.bones;
  const is2d = state.mode === '2d';

  const tips = el('div');
  tips.style.cssText = 'font-size:10px;color:#7c8698;margin-bottom:8px;line-height:1.5;';
  tips.innerHTML = `共 ${bones.length} 个骨骼 · 拖动下方滑块微调偏移与旋转`;
  container.appendChild(tips);

  for (let i = 0; i < bones.length; i++) {
    const b = bones[i];
    const card = el('div', 'bone-card');

    const head = el('div', 'bhead');
    const dot = el('span', 'bdot');
    dot.style.background = b.color || o.color;
    dot.style.color = b.color || o.color;
    const nameInput = document.createElement('input');
    nameInput.className = 'bname';
    nameInput.value = b.name || ('骨骼' + i);
    nameInput.addEventListener('input', () => { b.name = nameInput.value; });
    const parentSel = document.createElement('select');
    const op0 = document.createElement('option');
    op0.value = '-1'; op0.textContent = '根';
    parentSel.appendChild(op0);
    for (let k = 0; k < bones.length; k++) {
      if (k === i) continue;
      const op = document.createElement('option');
      op.value = k; op.textContent = '→' + (bones[k].name || ('骨骼' + k));
      if (b.parent === k) op.selected = true;
      parentSel.appendChild(op);
    }
    parentSel.addEventListener('change', () => {
      const v = parseInt(parentSel.value);
      let p = v, depth = 0;
      while (p >= 0 && depth < 50) {
        if (p === i) { toast('不能形成循环父级'); parentSel.value = b.parent ?? -1; return; }
        p = bones[p].parent;
        depth++;
      }
      b.parent = v;
      o._boneVersion = (o._boneVersion || 0) + 1;
      if (!is2d) syncScene3d();
    });
    const delBtn = el('button', 'tiny danger', '×');
    delBtn.addEventListener('click', () => {
      bones.splice(i, 1);
      for (const bb of bones) {
        if (bb.parent === i) bb.parent = -1;
        else if (bb.parent > i) bb.parent--;
      }
      o._boneVersion = (o._boneVersion || 0) + 1;
      if (!is2d) syncScene3d();
      renderInspector();
    });
    head.append(dot, nameInput, parentSel, delBtn);
    card.appendChild(head);

    const colorSec = el('div', 'bone-sec');
    const colorRow = el('div');
    colorRow.style.cssText = 'display:flex;align-items:center;gap:6px;';
    const colorInp = document.createElement('input');
    colorInp.type = 'color'; colorInp.value = b.color || o.color;
    colorInp.style.cssText = 'width:34px;height:24px;padding:0;border:1px solid var(--border);border-radius:4px;background:#0d1016;cursor:pointer;';
    colorInp.addEventListener('input', () => {
      b.color = colorInp.value;
      dot.style.background = b.color;
      dot.style.color = b.color;
      o._boneVersion = (o._boneVersion || 0) + 1;
      if (!is2d) syncScene3d();
    });
    colorRow.append(colorInp, el('span', null, '<span style="font-size:10px;color:#7c8698;font-weight:800">骨骼颜色</span>'));
    colorSec.appendChild(colorRow);
    card.appendChild(colorSec);

    const posSec = el('div', 'bone-sec');
    posSec.appendChild(el('div', 'bs-label', '偏移 Offset'));
    posSec.appendChild(boneSlider('X 横向', b.ox || 0, -160, 160, 1, v => {
      b.ox = v;
      o._boneVersion = (o._boneVersion || 0) + 1;
      if (!is2d) syncScene3d();
    }));
    posSec.appendChild(boneSlider('Y 纵向', b.oy || 0, -160, 160, 1, v => {
      b.oy = v;
      o._boneVersion = (o._boneVersion || 0) + 1;
      if (!is2d) syncScene3d();
    }));
    if (!is2d) {
      posSec.appendChild(boneSlider('Z 深度', b.oz || 0, -160, 160, 1, v => {
        b.oz = v;
        o._boneVersion = (o._boneVersion || 0) + 1;
        syncScene3d();
      }));
    }
    card.appendChild(posSec);

    const rotSec = el('div', 'bone-sec');
    rotSec.appendChild(el('div', 'bs-label', '旋转 Rotation'));
    if (is2d) {
      rotSec.appendChild(boneSlider('角度', b.rz || 0, -180, 180, 1, v => {
        b.rz = v;
        o._boneVersion = (o._boneVersion || 0) + 1;
      }, '°'));
    } else {
      for (const k of ['rx', 'ry', 'rz']) {
        rotSec.appendChild(boneSlider(k.toUpperCase(), b[k] || 0, -180, 180, 1, v => {
          b[k] = v;
          o._boneVersion = (o._boneVersion || 0) + 1;
          syncScene3d();
        }, '°'));
      }
    }
    card.appendChild(rotSec);

    const szSec = el('div', 'bone-sec');
    szSec.appendChild(el('div', 'bs-label', '尺寸 Size'));
    const szMax = is2d ? 120 : 1.5;
    const szStep = is2d ? 1 : 0.02;
    szSec.appendChild(boneSlider('宽', b.sx || (is2d ? 20 : 0.3), 1, szMax, szStep, v => {
      b.sx = v;
      o._boneVersion = (o._boneVersion || 0) + 1;
      if (!is2d) syncScene3d();
    }));
    szSec.appendChild(boneSlider('高', b.sy || (is2d ? 20 : 0.3), 1, szMax, szStep, v => {
      b.sy = v;
      o._boneVersion = (o._boneVersion || 0) + 1;
      if (!is2d) syncScene3d();
    }));
    if (!is2d) {
      szSec.appendChild(boneSlider('深', b.sz || (b.sx || 0.3), 0.05, szMax, szStep, v => {
        b.sz = v;
        o._boneVersion = (o._boneVersion || 0) + 1;
        syncScene3d();
      }));
    }
    card.appendChild(szSec);

    container.appendChild(card);
  }
  return container;
}

function renderParticlesEditor(o) {
  const wrap = el('div');
  o.particles = o.particles || { enabled: true, count: 20, color: o.color, speed: state.mode === '2d' ? 200 : 4, life: 0.8, size: state.mode === '2d' ? 4 : 0.15, gravity: state.mode === '2d' ? 400 : 8, sound: true };
  const p = o.particles;
  wrap.appendChild(rowCheck('启用破坏粒子', p.enabled, v => { p.enabled = v; renderInspector(); }));
  if (!p.enabled) return wrap;

  wrap.appendChild(rowSlider('粒子数量', p.count, 1, 80, 1, v => { p.count = v; }));
  wrap.appendChild(rowColor('粒子颜色', p.color, v => { p.color = v; }));
  const spdMax = state.mode === '2d' ? 600 : 15;
  wrap.appendChild(rowSlider('爆发速度', p.speed, 20, spdMax, 5, v => { p.speed = v; }));
  wrap.appendChild(rowSlider('存活时间', p.life, 0.1, 2.5, 0.05, v => { p.life = v; }, 's'));
  const szMax = state.mode === '2d' ? 12 : 0.5;
  wrap.appendChild(rowSlider('粒子大小', p.size, 1, szMax, state.mode === '2d' ? 0.5 : 0.01, v => { p.size = v; }));
  const gMax = state.mode === '2d' ? 1200 : 30;
  wrap.appendChild(rowSlider('粒子重力', p.gravity, 0, gMax, 5, v => { p.gravity = v; }));
  wrap.appendChild(rowCheck('播放爆炸音效', p.sound, v => { p.sound = v; }));

  const testBtn = el('button', 'mini', '💥 测试粒子');
  testBtn.style.width = '100%';
  testBtn.addEventListener('click', () => {
    ensureAudio();
    if (state.mode === '2d') Particles.spawn2d(o.x, o.y, p);
    else Particles.spawn3d(o.pos, p);
    if (p.sound) sfx('explosion', 0.35);
  });
  wrap.appendChild(testBtn);
  return wrap;
}

function renderLogicEditor(o) {
  const wrap = el('div');
  if (!o.logic) o.logic = [];
  const others = objs().filter(x => x.id !== o.id);

  for (let i = 0; i < o.logic.length; i++) {
    const rule = o.logic[i];
    const card = el('div', 'logic-card' + (rule.enabled === false ? ' disabled' : ''));

    const head = el('div', 'lc-head');
    head.appendChild(el('span', 'lc-idx', '规则 #' + (i + 1)));
    head.appendChild(el('span', 'lc-spacer'));
    const enChk = document.createElement('input');
    enChk.type = 'checkbox'; enChk.checked = rule.enabled !== false;
    enChk.style.cssText = 'width:14px;height:14px;accent-color:#ffd93d;cursor:pointer;';
    enChk.addEventListener('change', () => {
      rule.enabled = enChk.checked;
      renderInspector();
    });
    head.appendChild(enChk);
    const delBtn = el('button', 'tiny danger', '×');
    delBtn.addEventListener('click', () => {
      o.logic.splice(i, 1);
      renderInspector();
      renderHierarchy();
    });
    head.appendChild(delBtn);
    card.appendChild(head);

    const trigRow = el('div', 'lc-row');
    trigRow.appendChild(el('label', null, '触发方式'));
    const trigSel = document.createElement('select');
    for (const [v, n] of [['collide', '碰撞时'], ['keypress', '按键时'], ['interval', '定时循环']]) {
      const op = document.createElement('option');
      op.value = v; op.textContent = n;
      if (rule.trigger === v) op.selected = true;
      trigSel.appendChild(op);
    }
    trigSel.addEventListener('change', () => {
      rule.trigger = trigSel.value;
      renderInspector();
    });
    trigRow.appendChild(trigSel);
    card.appendChild(trigRow);

    if (rule.trigger === 'collide') {
      const tRow = el('div', 'lc-row');
      tRow.appendChild(el('label', null, '碰撞目标（留空 = 任意对象）'));
      const tSel = document.createElement('select');
      const op0 = document.createElement('option');
      op0.value = ''; op0.textContent = '任意对象';
      tSel.appendChild(op0);
      for (const t of others) {
        const op = document.createElement('option');
        op.value = t.id; op.textContent = t.name;
        if (rule.targetId === t.id) op.selected = true;
        tSel.appendChild(op);
      }
      tSel.addEventListener('change', () => { rule.targetId = tSel.value; });
      tRow.appendChild(tSel);
      card.appendChild(tRow);
    }

    if (rule.trigger === 'keypress') {
      const kRow = el('div', 'lc-row');
      kRow.appendChild(el('label', null, '按键'));
      const kInp = document.createElement('input');
      kInp.type = 'text';
      kInp.value = rule.key || 'e';
      kInp.maxLength = 8;
      kInp.addEventListener('input', () => { rule.key = kInp.value; });
      kRow.appendChild(kInp);
      card.appendChild(kRow);
    }

    if (rule.trigger === 'interval') {
      const iRow = el('div', 'lc-row');
      iRow.appendChild(el('label', null, '间隔（秒）'));
      const iInp = document.createElement('input');
      iInp.type = 'number';
      iInp.step = 0.1; iInp.min = 0.05;
      iInp.value = rule.interval ?? 2;
      iInp.addEventListener('input', () => { rule.interval = Math.max(0.05, parseFloat(iInp.value) || 1); });
      iRow.appendChild(iInp);
      card.appendChild(iRow);
    }

    const aRow = el('div', 'lc-row');
    aRow.appendChild(el('label', null, '执行动作'));
    const aSel = document.createElement('select');
    for (const [v, n] of [
      ['destroy_target', '销毁目标'],
      ['destroy_self', '销毁自身'],
      ['damage_target', '伤害目标'],
      ['damage_self', '伤害自身'],
      ['heal_self', '治疗自身'],
      ['heal_target', '治疗目标'],
      ['push_target', '击退目标'],
      ['teleport_self', '传送到目标'],
      ['particle', '生成粒子'],
      ['sound', '播放音效']
    ]) {
      const op = document.createElement('option');
      op.value = v; op.textContent = n;
      if (rule.action === v) op.selected = true;
      aSel.appendChild(op);
    }
    aSel.addEventListener('change', () => {
      rule.action = aSel.value;
      renderInspector();
    });
    aRow.appendChild(aSel);
    card.appendChild(aRow);

    if (['damage_target', 'damage_self', 'heal_self', 'heal_target', 'push_target'].includes(rule.action)) {
      const nRow = el('div', 'lc-row');
      nRow.appendChild(el('label', null, '数值'));
      const nInp = document.createElement('input');
      nInp.type = 'number';
      nInp.value = rule.amount ?? 10;
      nInp.addEventListener('input', () => { rule.amount = parseFloat(nInp.value) || 0; });
      nRow.appendChild(nInp);
      card.appendChild(nRow);
    }

    if (rule.action === 'sound') {
      const sRow = el('div', 'lc-row');
      sRow.appendChild(el('label', null, '音效'));
      const sSel = document.createElement('select');
      for (const [v, n] of [['hit', '撞击'], ['jump', '跳跃'], ['coin', '金币'], ['laser', '激光'], ['explosion', '爆炸'], ['beep', '哔'], ['powerup', '强化']]) {
        const op = document.createElement('option');
        op.value = v; op.textContent = n;
        if (rule.sound === v) op.selected = true;
        sSel.appendChild(op);
      }
      sSel.addEventListener('change', () => { rule.sound = sSel.value; });
      sRow.appendChild(sSel);
      card.appendChild(sRow);
    }

    const oRow = el('div', 'lc-row');
    const oChk = document.createElement('input');
    oChk.type = 'checkbox'; oChk.checked = rule.once !== false;
    oChk.style.cssText = 'width:14px;height:14px;accent-color:#ffd93d;cursor:pointer;vertical-align:middle;';
    const oLbl = el('label', null, '仅触发一次');
    oLbl.style.cssText = 'display:inline;margin-left:6px;font-size:11px;color:#d5dae3;cursor:pointer;';
    oLbl.addEventListener('click', () => { oChk.checked = !oChk.checked; rule.once = oChk.checked; });
    oChk.addEventListener('change', () => { rule.once = oChk.checked; });
    oRow.append(oChk, oLbl);
    card.appendChild(oRow);

    wrap.appendChild(card);
  }

  const addBtn = el('button', 'mini', '+ 添加交互规则');
  addBtn.style.cssText = 'width:100%;border-color:#ffd93d;color:#ffd93d;';
  addBtn.addEventListener('click', () => {
    o.logic.push({
      id: 'L' + uid(),
      enabled: true,
      trigger: 'collide',
      targetId: '',
      key: 'e',
      interval: 2,
      action: 'sound',
      amount: 10,
      sound: 'coin',
      once: true
    });
    renderInspector();
    renderHierarchy();
  });
  wrap.appendChild(addBtn);
  return wrap;
}

function renderInspector() {
  const p = els.props;
  p.innerHTML = '';
  const o = getSelected();
  if (!o) {
    p.innerHTML = '<div class="empty">未选中对象<br><span style="font-size:11px">点击视口或层级列表选择</span></div>';
    return;
  }

  p.appendChild(rowText('名称', o.name, v => { o.name = v; renderHierarchy(); }));

  if (o.isPlayer) {
    p.appendChild(renderPlayerTuning(o));
  }

  if (state.mode === '2d') {
    p.appendChild(groupTitle('变换'));
    p.appendChild(rowVec('位置', [
      { name: 'X', value: o.x, onInput: v => { o.x = v; } },
      { name: 'Y', value: o.y, onInput: v => { o.y = v; } }
    ]));
    p.appendChild(rowVec('尺寸', [
      { name: 'W', value: o.w, onInput: v => { o.w = Math.max(2, v); } },
      { name: 'H', value: o.h, onInput: v => { o.h = Math.max(2, v); } }
    ]));
    p.appendChild(rowNum('旋转 (°)', o.rot || 0, v => { o.rot = v; }, 5));
    if (o.type === 'rect') p.appendChild(rowNum('圆角', o.radius || 0, v => { o.radius = v; }, 1));

    if (o.type === 'text') {
      p.appendChild(groupTitle('文字内容'));
      p.appendChild(rowText('文本', o.text, v => { o.text = v; }));
      p.appendChild(rowNum('字号', o.fontSize || 24, v => { o.fontSize = Math.max(6, v); }, 1));
    }

    p.appendChild(groupTitle('外观'));
    p.appendChild(rowColor('颜色', o.color, v => { o.color = v; }));
    p.appendChild(rowCheck('可见', o.visible !== false, v => { o.visible = v; renderHierarchy(); }));

    if (o.type === 'creature') {
      o.maxHp = o.maxHp ?? 30;
      o.hp = o.hp ?? o.maxHp;
      o.faction = o.faction || 'enemy';
      o.defense = o.defense ?? 0;
      o.attack = o.attack ?? 5;
      o.stateName = o.stateName || '待机';

      p.appendChild(groupTitle('生物属性'));
      const hpPct = clamp(o.hp / o.maxHp, 0, 1);
      p.appendChild(el('div', 'hp-bar', `<i style="width:${hpPct * 100}%;background:${FACTION_COLOR[o.faction]}"></i>`));
      p.appendChild(rowNum('当前 HP', o.hp, v => { o.hp = Math.min(o.maxHp, Math.max(0, v)); renderInspector(); }, 1, 0));
      p.appendChild(rowNum('最大 HP', o.maxHp, v => { o.maxHp = Math.max(1, v); if (o.hp > o.maxHp) o.hp = o.maxHp; renderInspector(); }, 1, 1));
      p.appendChild(rowSelect('阵营', o.faction, [['friend', '友方'], ['enemy', '敌方'], ['neutral', '中立']], v => { o.faction = v; renderHierarchy(); renderInspector(); }));
      p.appendChild(rowText('状态', o.stateName, v => { o.stateName = v; }));
      p.appendChild(rowNum('防御值', o.defense, v => { o.defense = Math.max(0, v); }, 1, 0));
      p.appendChild(rowNum('攻击力', o.attack, v => { o.attack = Math.max(0, v); }, 1, 0));

      p.appendChild(groupTitle('骨骼绑定', [{
        text: '+ 加骨骼', onClick: () => {
          o.bones = o.bones || defaultBones();
          o.bones.push({
            id: 'b' + uid(), name: '骨骼' + o.bones.length, parent: 0,
            ox: 0, oy: 0, oz: 0, rx: 0, ry: 0, rz: 0,
            sx: 16, sy: 16, sz: 16, color: o.color
          });
          o._boneVersion = (o._boneVersion || 0) + 1;
          if (state.mode === '3d') syncScene3d();
          renderInspector();
        }
      }, {
        text: '重置', onClick: () => {
          o.bones = defaultBones();
          o._boneVersion = (o._boneVersion || 0) + 1;
          if (state.mode === '3d') syncScene3d();
          renderInspector();
        }
      }]));
      p.appendChild(renderBonesEditor(o));
    }

    p.appendChild(groupTitle('粒子破坏与效果'));
    p.appendChild(renderParticlesEditor(o));

    p.appendChild(groupTitle('玩家控制'));
    p.appendChild(rowCheck('设为玩家角色（镜头跟随）', o.isPlayer, v => {
      if (v) objs().forEach(x => x.isPlayer = false);
      o.isPlayer = v;
      if (v) { o.controllable = o.controllable !== false; o.moveSpeed = o.moveSpeed ?? 320; }
      renderHierarchy();
      renderInspector();
    }));
    if (o.isPlayer) {
      p.appendChild(rowCheck('可拖动轮盘控制', o.controllable !== false, v => { o.controllable = v; }));
      p.appendChild(rowNum('移动速度', o.moveSpeed ?? 320, v => { o.moveSpeed = Math.max(20, v); }, 10, 20));
      if (o.gravity) {
        p.appendChild(rowNum('跳跃力度', o.jumpPower ?? 560, v => { o.jumpPower = Math.max(100, v); }, 20, 100));
      }
    }

    p.appendChild(groupTitle('交互逻辑'));
    p.appendChild(renderLogicEditor(o));

    p.appendChild(groupTitle('对象绑定'));
    const otherObjs = objs().filter(x => x.id !== o.id);
    const bindOpts = [['', '不绑定']].concat(otherObjs.map(x => [x.id, x.name]));
    p.appendChild(rowSelect('绑定到父级', o.bindParent || '', bindOpts, v => {
      if (!v) { o.bindParent = null; }
      else {
        let p2 = v, depth = 0;
        while (p2 && depth < 50) {
          if (p2 === o.id) { toast('不能绑定到自己或循环'); return; }
          const pp = objs().find(x => x.id === p2);
          p2 = pp?.bindParent;
          depth++;
        }
        o.bindParent = v;
        const parent = objs().find(x => x.id === v);
        if (parent) {
          o.bindOffset = [o.x - parent.x, o.y - parent.y];
          o._bindRot = (o.rot || 0) - (parent.rot || 0);
        }
      }
      renderInspector();
    }));
    if (o.bindParent) {
      p.appendChild(rowVec('绑定偏移', [
        { name: 'X', value: o.bindOffset?.[0] ?? 0, onInput: v => { o.bindOffset = o.bindOffset || [0, 0]; o.bindOffset[0] = v; } },
        { name: 'Y', value: o.bindOffset?.[1] ?? 0, onInput: v => { o.bindOffset = o.bindOffset || [0, 0]; o.bindOffset[1] = v; } }
      ]));
    }

    p.appendChild(groupTitle('物理'));
    p.appendChild(rowCheck('参与碰撞', o.collide !== false, v => { o.collide = v; }));
    p.appendChild(rowNum('重力 (px/s²)', o.gravity || 0, v => { o.gravity = v; }, 50));
    p.appendChild(rowNum('弹性 (0-1.5)', o.bounce ?? 0.6, v => { o.bounce = clamp(v, 0, 1.5); }, 0.05));
    p.appendChild(rowVec('初速度', [
      { name: 'VX', value: o.vx || 0, onInput: v => { o.vx = v; } },
      { name: 'VY', value: o.vy || 0, onInput: v => { o.vy = v; } }
    ]));

    p.appendChild(groupTitle('音效'));
    o.sound = o.sound || { enabled: false, type: 'hit', volume: 0.3 };
    p.appendChild(rowCheck('碰撞时播放', o.sound.enabled, v => { o.sound.enabled = v; }));
    p.appendChild(selectSfxRow('音效类型', o.sound.type, v => { o.sound.type = v; ensureAudio(); sfx(v, o.sound.volume); }));
    p.appendChild(rowNum('音量', o.sound.volume ?? 0.3, v => { o.sound.volume = clamp(v, 0, 1); }, 0.05, 0, 1));

  } else {
    p.appendChild(groupTitle('变换'));
    p.appendChild(rowVec('位置', [
      { name: 'X', value: o.pos[0], onInput: v => { o.pos[0] = v; syncScene3d(); } },
      { name: 'Y', value: o.pos[1], onInput: v => { o.pos[1] = v; syncScene3d(); } },
      { name: 'Z', value: o.pos[2], onInput: v => { o.pos[2] = v; syncScene3d(); } }
    ]));
    p.appendChild(rowVec('旋转°', [

/* =========================================================
   放置栏：滚动提示 + 移动端友好点击
   ========================================================= */
function updateAddBtnsScrollArrows() {
  const wrap = document.getElementById('addBtnsWrap');
  const el = document.getElementById('addBtns');
  if (!wrap || !el) return;
  const canLeft = el.scrollLeft > 2;
  const canRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 2;
  wrap.classList.toggle('hasLeft', canLeft);
  wrap.classList.toggle('hasRight', canRight);
}

/* 关键：用 pointer 事件 + 移动阈值来区分点击和滑动 */
function makeAddBtn(label, onClick) {
  const b = document.createElement('button');
  b.textContent = label;
  b.style.touchAction = 'pan-x';
  let sx = 0, sy = 0, moved = false, pid = null;
  b.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY; moved = false; pid = e.pointerId;
  });
  b.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) moved = true;
  });
  const fire = e => {
    if (e.pointerId !== pid) return;
    if (!moved) onClick();
    pid = null;
  };
  b.addEventListener('pointerup', fire);
  b.addEventListener('pointercancel', () => { pid = null; moved = true; });
  // 阻止浏览器默认点击（避免滑动后误触发）
  b.addEventListener('click', e => e.preventDefault());
  return b;
}

function renderAddButtons() {
  const wrap = $('#addBtns');
  wrap.innerHTML = '';
  const list = state.mode === '2d' ? TYPES_2D : TYPES_3D;
  for (const it of list) {
    const b = makeAddBtn(it.n, () => addObject(it.t));
    wrap.appendChild(b);
  }
  wrap.scrollLeft = 0;
  requestAnimationFrame(updateAddBtnsScrollArrows);
}

// 监听放置栏滚动
(function () {
  const el = $('#addBtns');
  if (!el) return;
  el.addEventListener('scroll', updateAddBtnsScrollArrows, { passive: true });
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      el.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });
  // 阻止多指缩放
  el.addEventListener('touchstart', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  el.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
})();

/* =========================================================
   删除 / 复制 / 单对象保存
   ========================================================= */
function deleteSelected() {
  const o = getSelected();
  if (!o) return;
  const arr = objs();
  arr.splice(arr.indexOf(o), 1);
  for (const x of arr) if (x.bindParent === o.id) x.bindParent = null;
  state.selectedId = null;
  if (state.mode === '3d') { syncScene3d(); select3d(null); }
  renderHierarchy();
  renderInspector();
  updateStatus();
}

function duplicateSelected() {
  const o = getSelected();
  if (!o) return;
  const c = JSON.parse(JSON.stringify(o));
  c.id = uid();
  c.name = o.name + ' 副本';
  if (state.mode === '2d') { c.x += 26; c.y += 26; }
  else {
    c.pos[0] += 1.5; c.pos[2] += 1.5;
    if (c.path) c.path.points = c.path.points.map(p => [p[0] + 1.5, p[1], p[2] + 1.5]);
  }
  if (c.logic) for (const r of c.logic) { r._fired = false; r._timer = 0; }
  if (c.type === 'text3d') c._textVersion = 0;
  objs().push(c);
  if (state.mode === '3d') syncScene3d();
  select(c.id);
}

function saveSingleObject() {
  const o = getSelected();
  if (!o) return toast('请先选中一个对象');
  const clean = JSON.parse(JSON.stringify(o));
  if (clean.logic) for (const r of clean.logic) { delete r._fired; delete r._timer; }
  const data = {
    type: 'single-object',
    version: 3,
    mode: state.mode,
    object: clean
  };
  const safeName = (o.name || 'object').replace(/[\\/:*?"<>|]/g, '_');
  download(JSON.stringify(data, null, 2), safeName + '.obj.json', 'application/json');
  toast('已单独保存：' + o.name);
}

function loadSingleObject(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      let obj;
      if (data.type === 'single-object' && data.object) obj = data.object;
      else if (data.id && data.type) obj = data;
      else throw new Error('不是有效的对象文件');
      obj.id = uid();
      if (!obj.bindParent) obj.bindParent = null;
      if (!obj.sound) obj.sound = { enabled: false, type: 'hit', volume: 0.3 };
      if (!obj.logic) obj.logic = [];
      if (state.mode === '3d' && !obj.path) obj.path = { enabled: false, points: [], speed: 1, mode: 'loop' };
      if (obj.type === 'creature' && !obj.bones) obj.bones = defaultBones();
      if (obj.type === 'text3d') obj._textVersion = 0;
      objs().push(obj);
      if (state.mode === '3d') syncScene3d();
      select(obj.id);
      toast('已导入对象：' + (obj.name || obj.type));
    } catch (e) {
      toast('导入对象失败：' + e.message);
    }
  };
  r.readAsText(file);
}

/* =========================================================
   模式切换
   ========================================================= */
async function setMode(mode) {
  if (state.mode === mode) return;
  stop();
  state.mode = mode;
  state.selectedId = null;
  $$('#modeSeg button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

  if (mode === '3d') {
    cv.style.display = 'none';
    $('#vp3d').style.display = 'block';
    await ensure3d();
    resize3d();
    syncScene3d();
    select3d(null);
  } else {
    cv.style.display = 'block';
    $('#vp3d').style.display = 'none';
    resize2d();
  }

  renderAddButtons();
  renderHierarchy();
  renderInspector();
  updateStatus();
}

function setHint(msg) { $('#stHint').textContent = msg; }

function updateStatus() {
  $('#stMode').innerHTML = '模式：<b>' + (state.mode === '2d' ? '2D 画布' : '3D 场景') + '</b>';
  const o = getSelected();
  $('#stSel').innerHTML = o ? '选中：<b>' + esc(o.name) + '</b>' + (o.isPlayer ? ' 🎮' : '') : '未选中';
  if (state.playing) {
    setHint('▶ 运行中 · 拖动左下角轮盘移动玩家 · 点击「停止」还原');
  } else if (state.mode === '2d') {
    setHint(`缩放 ${(state.cam2d.zoom * 100).toFixed(0)}% · 滚轮缩放 · 空白拖拽平移 · Del 删除 · Ctrl+D 复制`);
  } else {
    setHint(`左键旋转 · 右键平移 · 滚轮缩放 · W/E/R 切换 移动/旋转/缩放 · Del 删除`);
  }
}

/* =========================================================
   保存 / 读取
   ========================================================= */
function sceneData() {
  const clean = JSON.parse(JSON.stringify(state.scenes));
  for (const k of ['2d', '3d']) {
    for (const o of clean[k]) {
      if (o.logic) for (const r of o.logic) { delete r._fired; delete r._timer; }
      delete o._dead;
      delete o._jumping;
    }
  }
  return {
    version: 7,
    projectName: state.projectName,
    mode: state.mode,
    scenes: clean,
    nextId: _id
  };
}

function saveJSON() {
  const safeName = (state.projectName || 'game').replace(/[\\/:*?"<>|]/g, '_');
  download(JSON.stringify(sceneData(), null, 2), safeName + '.scene.json', 'application/json');
  toast('工程已导出：' + state.projectName);
}

function loadJSON(text) {
  try {
    const data = JSON.parse(text);
    if (!data.scenes) throw new Error('格式错误：缺少 scenes');
    stop();
    state.scenes['2d'] = data.scenes['2d'] || [];
    state.scenes['3d'] = data.scenes['3d'] || [];
    if (data.projectName) {
      state.projectName = data.projectName;
      $('#projName').value = data.projectName;
    }
    for (const k of ['2d', '3d']) {
      for (const o of state.scenes[k]) {
        if (o.collide === undefined) o.collide = true;
        if (o.isPlayer === undefined) o.isPlayer = false;
        if (o.bindParent === undefined) o.bindParent = null;
        if (!o.bindOffset) o.bindOffset = k === '2d' ? [0, 0] : [0, 0, 0];
        if (!o.sound) o.sound = { enabled: false, type: 'hit', volume: 0.3 };
        if (!o.logic) o.logic = [];
        if (o.controllable === undefined && o.isPlayer) o.controllable = true;
        if (o.moveSpeed === undefined && o.isPlayer) o.moveSpeed = k === '2d' ? 320 : 7;
        if (k === '3d' && !o.path) o.path = { enabled: false, points: [], speed: 1, mode: 'loop' };
        if (o.type === 'text3d' && o._textVersion === undefined) o._textVersion = 0;
        if (o.type === 'creature') {
          if (!o.bones) o.bones = defaultBones();
          if (o.maxHp == null) o.maxHp = 30;
          if (o.hp == null) o.hp = o.maxHp;
          if (!o.faction) o.faction = 'enemy';
          if (o.defense == null) o.defense = 0;
          if (o.attack == null) o.attack = 5;
          if (!o.stateName) o.stateName = '待机';
          if (!o.particles) o.particles = { enabled: true, count: 20, color: o.color, speed: k === '2d' ? 200 : 4, life: 0.8, size: k === '2d' ? 4 : 0.15, gravity: k === '2d' ? 400 : 8, sound: true };
        }
      }
    }
    _id = data.nextId || 1000;
    state.selectedId = null;
    if (state.mode === '3d') syncScene3d();
    renderHierarchy();
    renderInspector();
    updateStatus();
    toast('工程已导入：' + state.projectName);
    return true;
  } catch (e) {
    toast('导入失败：' + e.message);
    return false;
  }
}

function copyB64() {
  const b64 = toB64(JSON.stringify(sceneData()));
  navigator.clipboard.writeText(b64).then(
    () => toast('✅ 场景已复制为 Base64（' + b64.length + ' 字符）'),
    () => { $('#b64Input').value = b64; $('#b64Modal').classList.add('on'); toast('已填入弹窗，请手动复制'); }
  );
}

/* =========================================================
   导出独立 HTML 游戏
   ========================================================= */
function buildGameRuntime() {
  return function GAME_RUNTIME(data) {
    const MODE = data.mode;
    const OBJS = (data.scenes[MODE] || []).map(o => JSON.parse(JSON.stringify(o)));
    const TITLE = data.projectName || '我的游戏';

    ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
      document.addEventListener(evt, e => e.preventDefault(), { passive: false });
    });
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    let _lte = 0;
    document.addEventListener('touchend', e => {
      if (e.target.closest('button, input, select, textarea')) return;
      const n = Date.now();
      if (n - _lte < 300) e.preventDefault();
      _lte = n;
    }, { passive: false });
    window.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive: false, capture: true });

    let audioCtx = null, running = false, lastT = 0;

    const keys = {};
    addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    const SFX = {
      jump: ['square',180,520,.14], hit: ['sawtooth',260,70,.16], coin: ['sine',880,1400,.22],
      laser: ['sawtooth',1400,220,.2], explosion: ['sawtooth',140,40,.5],
      beep: ['sine',440,440,.1], powerup: ['triangle',330,990,.3]
    };
    function sfx(type, vol) {
      if (!audioCtx || !type || type === 'none') return;
      const c = SFX[type] || SFX.beep;
      const v = Math.max(.01, Math.min(1, vol == null ? .3 : vol));
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = c[0];
      o.frequency.setValueAtTime(c[1], t);
      if (c[1] !== c[2]) o.frequency.exponentialRampToValueAtTime(c[2], t + c[3] * .8);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(.001, t + c[3]);
      o.start(t); o.stop(t + c[3] + .02);
    }
    const th = {};
    function sfxT(k, t, v) { const n = performance.now(); if (th[k] && n - th[k] < 90) return; th[k] = n; sfx(t, v); }

    const J = { active: false, pointerId: null, dx: 0, dy: 0, el: null, stick: null };
    function setupJoy() {
      const el = document.getElementById('joystick');
      if (!el) return;
      J.el = el;
      J.stick = el.querySelector('.joy-stick');
      function update(e) {
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const mr = r.width / 2 - 10;
        let dx = e.clientX - cx, dy = e.clientY - cy;
        const len = Math.hypot(dx, dy);
        if (len > mr) { dx = dx / len * mr; dy = dy / len * mr; }
        J.dx = dx / mr; J.dy = dy / mr;
        J.stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      }
      el.addEventListener('pointerdown', e => {
        e.preventDefault(); e.stopPropagation();
        try { el.setPointerCapture(e.pointerId); } catch(_) {}
        J.pointerId = e.pointerId; J.active = true; update(e);
      });
      el.addEventListener('pointermove', e => {
        if (e.pointerId !== J.pointerId || !J.active) return;
        e.preventDefault(); update(e);
      });
      const end = e => {
        if (e.pointerId !== J.pointerId) return;
        J.active = false; J.pointerId = null; J.dx = 0; J.dy = 0;
        if (J.stick) J.stick.style.transform = 'translate(-50%, -50%)';
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    }

    const PL = [];
    function spawnP2(x, y, c) {
      const n = c.count || 18;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = (c.speed || 180) * (.5 + Math.random());
        PL.push({ x, y, z: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (c.speed || 180) * .3, vz: 0,
          life: (c.life || .8) * (.6 + Math.random() * .7), maxLife: c.life || .8,
          color: c.color || '#ffd93d', size: (c.size || 4) * (.5 + Math.random()), gravity: c.gravity ?? 400, is3d: false });
      }
    }
    function spawnP3(p, c) {
      const n = c.count || 24;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI - Math.PI / 2;
        const sp = (c.speed || 4) * (.5 + Math.random());
        PL.push({ x: p[0], y: p[1], z: p[2],
          vx: Math.cos(a) * Math.cos(b) * sp, vy: Math.sin(b) * sp + sp * .4, vz: Math.sin(a) * Math.cos(b) * sp,
          life: (c.life || 1) * (.6 + Math.random() * .7), maxLife: c.life || 1,
          color: c.color || '#ffd93d', size: (c.size || .15) * (.5 + Math.random()), gravity: c.gravity ?? 8, is3d: true });
      }
    }
    function updP(dt) {
      for (let i = PL.length - 1; i >= 0; i--) {
        const p = PL[i]; p.life -= dt;
        if (p.life <= 0) { PL.splice(i, 1); continue; }
        p.vy -= p.gravity * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        if (p.is3d && p.y < .05) { p.y = .05; p.vy *= -.4; p.vx *= .8; p.vz *= .8; }
      }
    }

    function damage(o, amt) {
      if (o._dead) return;
      const dmg = Math.max(1, amt - (o.defense || 0) * .5);
      o.hp = Math.max(0, (o.hp ?? 10) - dmg);
      if (o.sound && o.sound.enabled) sfx(o.sound.type, o.sound.volume);
      if (o.hp <= 0) destroy(o);
    }
    function destroy(o) {
      if (o._dead) return;
      o._dead = true; o.visible = false;
      if (o.particles && o.particles.enabled) {
        if (MODE === '2d') spawnP2(o.x, o.y, o.particles);
        else spawnP3(o.pos, o.particles);
        if (o.particles.sound) sfx('explosion', .35);
      }
    }

    function rOverlap(a, b) {
      const ahw = Math.abs(a.w)/2, ahh = Math.abs(a.h)/2;
      const bhw = Math.abs(b.w)/2, bhh = Math.abs(b.h)/2;
      return Math.abs(b.x - a.x) < ahw + bhw && Math.abs(b.y - a.y) < ahh + bhh;
    }
    function bbox(o) {
      const s = o.scale, p = o.pos;
      return { min: [p[0]-s[0]/2,p[1]-s[1]/2,p[2]-s[2]/2], max: [p[0]+s[0]/2,p[1]+s[1]/2,p[2]+s[2]/2] };
    }
    function bOverlap(a, b) {
      const A = bbox(a), B = bbox(b);
      return A.min[0] < B.max[0] && A.max[0] > B.min[0] &&
             A.min[1] < B.max[1] && A.max[1] > B.min[1] &&
             A.min[2] < B.max[2] && A.max[2] > B.min[2];
    }

    function execAction(owner, target, rule) {
      const act = rule.action || 'sound';
      const amt = rule.amount || 0;
      switch (act) {
        case 'destroy_self': destroy(owner); break;
        case 'destroy_target': if (target) destroy(target); break;
        case 'damage_self': damage(owner, amt || 5); break;
        case 'damage_target': if (target) damage(target, amt || 5); break;
        case 'heal_self': owner.hp = Math.min(owner.maxHp || 100, (owner.hp || 0) + (amt || 10)); break;
        case 'heal_target': if (target) target.hp = Math.min(target.maxHp || 100, (target.hp || 0) + (amt || 10)); break;
        case 'push_target':
          if (target) {
            if (MODE === '2d') {
              const dx = target.x - owner.x, dy = target.y - owner.y;
              const len = Math.hypot(dx, dy) || 1;
              target.vx = (dx / len) * (amt || 300);
              target.vy = (dy / len) * (amt || 300) - 120;
            } else {
              const dx = target.pos[0] - owner.pos[0], dz = target.pos[2] - owner.pos[2];
              const len = Math.hypot(dx, dz) || 1;
              target.vx = (dx / len) * (amt || 6);
              target.vz = (dz / len) * (amt || 6);
              target.vy = 3;
            }
          }
          break;
        case 'teleport_self':
          if (target) {
            if (MODE === '2d') { owner.x = target.x; owner.y = target.y - 60; }
            else { owner.pos = [target.pos[0], target.pos[1] + 2, target.pos[2]]; }
          }
          break;
        case 'particle':
          if (MODE === '2d') spawnP2(owner.x, owner.y, { count: 15, color: owner.color, speed: 220, life: .7 });
          else spawnP3(owner.pos, { count: 18, color: owner.color, speed: 3.5, life: .8 });
          break;
        case 'sound': default:
          sfx(rule.sound || 'hit', .32);
          break;
      }
    }
    function checkLogic(dt) {
      for (const o of OBJS) {
        if (o._dead || o.visible === false) continue;
        if (!o.logic || !o.logic.length) continue;
        for (const rule of o.logic) {
          if (rule.enabled === false) continue;
          if (rule.once && rule._fired) continue;
          let fired = false;
          if (rule.trigger === 'collide') {
            const target = rule.targetId ? OBJS.find(x => x.id === rule.targetId) : null;
            const cands = target ? [target] : OBJS;
            for (const t of cands) {
              if (!t || t === o || t._dead || t.visible === false) continue;
              const hit = MODE === '2d' ? rOverlap(o, t) : bOverlap(o, t);
              if (hit) { execAction(o, t, rule); fired = true; break; }
            }
          } else if (rule.trigger === 'keypress') {
            if (keys[(rule.key || 'e').toLowerCase()]) { execAction(o, null, rule); fired = true; }
          } else if (rule.trigger === 'interval') {
            rule._timer = (rule._timer || 0) + dt;
            if (rule._timer >= (rule.interval || 1)) { rule._timer = 0; execAction(o, null, rule); fired = true; }
          }
          if (fired && rule.once) rule._fired = true;
        }
      }
    }

    const c2d = document.getElementById('c2d');
    const ctx = c2d ? c2d.getContext('2d') : null;
    let CW = 0, CH = 0, DPR = 1;
    const cam = { x: 0, y: 0, zoom: 1 };

    function resize2d() {
      DPR = Math.min(devicePixelRatio || 1, 2);
      CW = innerWidth; CH = innerHeight;
      c2d.width = CW * DPR; c2d.height = CH * DPR;
      c2d.style.width = CW + 'px'; c2d.style.height = CH + 'px';
      cam.zoom = Math.min(1.2, Math.max(.45, Math.min(CW, CH) / 720));
    }
    function rrect(x, y, w, h, r) {
      r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
    function drawBones(o) {
      const bones = o.bones && o.bones.length ? o.bones : [];
      const draw = (i) => {
        const b = bones[i]; if (!b) return;
        ctx.save();
        ctx.translate(b.ox || 0, b.oy || 0);
        ctx.rotate((b.rz || 0) * Math.PI / 180);
        ctx.fillStyle = b.color || o.color;
        const w = b.sx || 20, h = b.sy || 20;
        rrect(-w/2, -h/2, w, h, Math.min(w, h) * .22);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
        for (let j = 0; j < bones.length; j++) if (bones[j].parent === i) draw(j);
        ctx.restore();
      };
      for (let i = 0; i < bones.length; i++) if (bones[i].parent === -1 || bones[i].parent == null) draw(i);
    }
    function draw2d() {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const g = ctx.createLinearGradient(0, 0, 0, CH);
      g.addColorStop(0, '#1b2233'); g.addColorStop(1, '#0d1017');
      ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
      ctx.save();
      ctx.translate(CW / 2, CH / 2);
      ctx.scale(cam.zoom, cam.zoom);
      ctx.translate(-cam.x, -cam.y);
      for (const o of OBJS) {
        if (o.visible === false || o._dead) continue;
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate((o.rot || 0) * Math.PI / 180);
        ctx.fillStyle = o.color || '#4a9eff';
        ctx.shadowColor = o.color || '#4a9eff';
        ctx.shadowBlur = o.isPlayer ? 22 : 8;
        if (o.type === 'creature') { ctx.shadowBlur = 14; drawBones(o); }
        else if (o.type === 'rect') { rrect(-o.w/2, -o.h/2, o.w, o.h, o.radius||0); ctx.fill(); }
        else if (o.type === 'circle') { ctx.beginPath(); ctx.ellipse(0,0,Math.abs(o.w)/2,Math.abs(o.h)/2,0,0,Math.PI*2); ctx.fill(); }
        else if (o.type === 'triangle') { ctx.beginPath(); ctx.moveTo(0,-o.h/2); ctx.lineTo(o.w/2,o.h/2); ctx.lineTo(-o.w/2,o.h/2); ctx.closePath(); ctx.fill(); }
        else if (o.type === 'text') {
          ctx.shadowBlur = 14;
          ctx.font = '800 ' + (o.fontSize||24) + 'px -apple-system,"PingFang SC",sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(o.text || '文本', 0, 0);
        }
        ctx.restore();
        if (o.type === 'creature') {
          const top = o.y - (o.h || 80) / 2 - 14;
          const w = 46, h = 5;
          const rr = Math.max(0, Math.min(1, (o.hp ?? 1) / (o.maxHp || 1)));
          ctx.save();
          ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(o.x - w/2, top, w, h);
          ctx.fillStyle = o.faction === 'enemy' ? '#ff5b5b' : o.faction === 'friend' ? '#2ee6a8' : '#9aa7b8';
          ctx.fillRect(o.x - w/2, top, w * rr, h);
          ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = .8;
          ctx.strokeRect(o.x - w/2, top, w, h);
          ctx.fillStyle = '#fff'; ctx.font = '700 9px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText((o.stateName || '') + ' ' + (o.hp ?? 0) + '/' + (o.maxHp ?? 0), o.x, top - 4);
          ctx.restore();
        }
      }
      for (const p of PL) {
        if (p.is3d) continue;
        const a = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (.4 + a * .6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    function step2d(dt) {
      const FLOOR = 240, WALL = 460, snd = [];
      for (const o of OBJS) {
        if (o.isPlayer && o.controllable !== false && J.active) {
          const spd = o.moveSpeed ?? 320;
          if (Math.abs(J.dx) > .08) o.vx = J.dx * spd;
          if (!o.gravity) o.vy = J.dy * spd;
          else if (J.dy < -.55 && !o._jumping) {
            o.vy = -(o.jumpPower ?? 560);
            o._jumping = true;
            if (o.sound && o.sound.enabled) sfx('jump', o.sound.volume);
          }
        }
        if (o.isPlayer && (!J.active || J.dy > -.35)) o._jumping = false;
      }
      for (const o of OBJS) {
        if (o.visible === false || o._dead || o.bindParent) continue;
        if (o.gravity) o.vy = (o.vy || 0) + o.gravity * dt;
        o.x += (o.vx || 0) * dt; o.y += (o.vy || 0) * dt;
      }
      for (const o of OBJS) {
        if (o.visible === false || o._dead || o.bindParent) continue;
        const hw = Math.abs(o.w)/2, hh = Math.abs(o.h)/2;
        let hit = false;
        if (o.y + hh > FLOOR) { o.y = FLOOR - hh; if (Math.abs(o.vy) > 90) hit = true; o.vy = -o.vy * (o.bounce ?? .6); if (Math.abs(o.vy) < 28) o.vy = 0; }
        if (o.y - hh < -FLOOR) { o.y = -FLOOR + hh; o.vy = Math.abs(o.vy) * (o.bounce ?? .6); }
        if (o.x - hw < -WALL) { o.x = -WALL + hw; o.vx = Math.abs(o.vx||0) * (o.bounce??.6); if (Math.abs(o.vx) > 90) hit = true; }
        if (o.x + hw > WALL) { o.x = WALL - hw; o.vx = -Math.abs(o.vx||0) * (o.bounce??.6); if (Math.abs(o.vx) > 90) hit = true; }
        if (hit && o.sound && o.sound.enabled) snd.push([o.sound, 'b' + o.id]);
      }
      for (let i = 0; i < OBJS.length; i++) {
        for (let j = i + 1; j < OBJS.length; j++) {
          const a = OBJS[i], b = OBJS[j];
          if (a.visible === false || b.visible === false || a._dead || b._dead) continue;
          if (!a.collide && !b.collide) continue;
          const ahw = Math.abs(a.w)/2, ahh = Math.abs(a.h)/2;
          const bhw = Math.abs(b.w)/2, bhh = Math.abs(b.h)/2;
          const dx = b.x - a.x, dy = b.y - a.y;
          const ox = (ahw + bhw) - Math.abs(dx), oy = (ahh + bhh) - Math.abs(dy);
          if (ox <= 0 || oy <= 0) continue;
          if (a.type === 'creature' && b.type === 'creature' && a.faction !== b.faction) {
            const now = performance.now();

    let T3, renderer, scene, camera, meshes = new Map(), ptGeo, ptPts, MAXP = 2000;

    function mat(c) { return new T3.MeshStandardMaterial({ color: new T3.Color(c), roughness: .45, metalness: .12 }); }

    function buildText3d(o) {

    function build(o) {

      let m;
      switch (o.type) {
        case 'box': m = new T3.Mesh(new T3.BoxGeometry(1,1,1), mat(col)); break;
        case 'sphere': m = new T3.Mesh(new T3.SphereGeometry(.5,32,20), mat(col)); break;
        case 'cylinder': m = new T3.Mesh(new T3.CylinderGeometry(.5,.5,1,32), mat(col)); break;
        case 'cone': m = new T3.Mesh(new T3.ConeGeometry(.5,1,32), mat(col)); break;
        case 'torus': m = new T3.Mesh(new T3.TorusGeometry(.5,.2,18,48), mat(col)); break;
        case 'plane': m = new T3.Mesh(new T3.PlaneGeometry(1,1), mat(col)); break;
        case 'creature': m = buildBones(o); break;
        case 'text3d': m = buildText3d(o); break;
        case 'pointLight': {
          m = new T3.Group();
          m.add(new T3.Mesh(new T3.SphereGeometry(.16,16,12), new T3.MeshBasicMaterial({ color: col })));

        }
        case 'directionalLight': {
          m = new T3.Group();
          m.add(new T3.Mesh(new T3.SphereGeometry(.16,16,12), new T3.MeshBasicMaterial({ color: col })));

        case 'camera3d': {

    }

    async function init3d() {
      T3 = await import('three');
      const el = document.getElementById('v3d');
      renderer = new T3.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T3.PCFSoftShadowMap;

      scene.background = new T3.Color('#14171e');

      camera.position.set(10, 8, 13);

      const sun = new T3.DirectionalLight(0xffffff, 2);
      sun.position.set(9, 16, 9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22 });

      const grid = new T3.GridHelper(80, 80, 0x3d4759, 0x242a35);
      grid.position.y = .002;
      scene.add(grid);

      for (const o of OBJS) {
        const m = build(o);
        scene.add(m);
        meshes.set(o.id, m);
      }

      ptGeo = new T3.BufferGeometry();
      ptGeo.setAttribute('position', new T3.BufferAttribute(new Float32Array(MAXP * 3), 3));
      ptGeo.setAttribute('color', new T3.BufferAttribute(new Float32Array(MAXP * 3), 3));

      ptPts.frustumCulled = false;
      scene.add(ptPts);

      resize3d();
    }
    function resize3d() {
      if (!renderer) return;
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    function sync3d() {
      if (!T3) return;
      for (const o of OBJS) {
        const m = meshes.get(o.id); if (!m) continue;

        m.rotation.set(o.rot[0]*Math.PI/180, o.rot[1]*Math.PI/180, o.rot[2]*Math.PI/180);
        m.scale.set(o.scale[0], o.scale[1], o.scale[2]);

    }
    function updPts() {
      if (!ptGeo) return;
      const pa = ptGeo.attributes.position.array, ca = ptGeo.attributes.color.array;
      const items = PL.filter(p => p.is3d);
      const n = Math.min(items.length, MAXP);
      const tc = new T3.Color();
      for (let i = 0; i < n; i++) {
        const p = items[i];
        pa[i*3] = p.x; pa[i*3+1] = p.y; pa[i*3+2] = p.z;
        tc.set(p.color);
        const a = Math.max(0, p.life / p.maxLife);
        ca[i*3] = tc.r*a; ca[i*3+1] = tc.g*a; ca[i*3+2] = tc.b*a;
      }
      for (let i = n; i < MAXP; i++) { pa[i*3+1] = -9999; ca[i*3] = ca[i*3+1] = ca[i*3+2] = 0; }

      ptGeo.attributes.color.needsUpdate = true;
      ptPts.visible = n > 0;
    }
    function step3d(dt) {
      const snd = [];
      if (J.active) {
        const p = OBJS.find(o => o.isPlayer && o.controllable !== false && !o._dead);
        if (p) {
          const camDir = new T3.Vector3();
          camera.getWorldDirection(camDir);
          camDir.y = 0;
          if (camDir.lengthSq() > .001) camDir.normalize();
          const camRight = new T3.Vector3().crossVectors(camDir, new T3.Vector3(0, 1, 0)).normalize();
          const mv = new T3.Vector3();
          mv.addScaledVector(camDir, -J.dy);
          mv.addScaledVector(camRight, J.dx);
          if (mv.lengthSq() > .001) mv.normalize();

      }
      for (const o of OBJS) {
        if (o.visible === false || o._dead || o.bindParent) continue;

          else if (md === 'pingpong') { const tot = (n-1)*2; const t = ((o.path._t % tot) + tot) % tot; const tt = t <= n-1 ? t : tot-t; seg = Math.min(Math.floor(tt), n-2); f = tt - seg; }
          else { const t = Math.min(o.path._t, n-1); seg = Math.min(Math.floor(t), n-2); f = t - seg; if (o.path._t >= n-1) o.path._t = n-1; }
          const p0 = pts[seg], p1 = pts[(seg+1) % n];

            if (Math.abs(o.vy) < .7) o.vy = 0;

        }
      }
      for (let i = 0; i < OBJS.length; i++) {
        for (let j = i + 1; j < OBJS.length; j++) {

            if (bp > 0) { b.vy = Math.abs(b.vy || 0) * (b.bounce ?? .5); if (Math.abs(b.vy) > 1.5 && b.sound?.enabled) snd.push([b.sound, 'cy' + b.id]); }
          }
        }
      }
      for (const o of OBJS) {
        if (!o.bindParent || o._dead) continue;

        if (p) { const off = o.bindOffset || [0,0,0]; o.pos = [p.pos[0]+off[0], p.pos[1]+off[1], p.pos[2]+off[2]]; }
      }
      for (const s of snd) sfxT(s[1], s[0].type, s[0].volume);
      sync3d();
      const p = OBJS.find(o => o.isPlayer && !o._dead);
      if (p) {
        const t = new T3.Vector3(p.pos[0], p.pos[1], p.pos[2]);

    function loop(t) {
      if (!running) return;
      requestAnimationFrame(loop);
      const dt = Math.min((t - lastT) / 1000, .05);
      lastT = t;
      updP(dt);
      if (MODE === '2d') { step2d(dt); checkLogic(dt); draw2d(); }
      else { step3d(dt); checkLogic(dt); updPts(); renderer.render(scene, camera); }
    }

    async function boot() {
      const startEl = document.getElementById('start');
      const startBtn = document.getElementById('startBtn');
      setupJoy();
      if (MODE === '2d') {
        c2d.style.display = 'block';
        resize2d();
        const p = OBJS.find(o => o.isPlayer);
        cam.x = p ? p.x : 0; cam.y = p ? p.y : 0;

      } else {

        startEl.classList.add('hide');
        setTimeout(() => { startEl.style.display = 'none'; }, 700);
        const player = OBJS.find(o => o.isPlayer && o.controllable !== false && o.visible !== false);
        if (J.el && player) J.el.style.display = 'block';
        running = true;
        lastT = performance.now();
        requestAnimationFrame(loop);
      }
      startBtn.addEventListener('click', startGame);
      startEl.addEventListener('click', startGame);
      addEventListener('keydown', e => {
        if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); startGame(); }
      });
    }
    boot();
  };
}

</body>
</html>`;

  const safeName = (state.projectName || 'game').replace(/[\\/:*?"<>|]/g, '_');
  download(html, safeName + '.html', 'text/html');
  toast('✅ 已导出：' + safeName + '.html');
}

/* =========================================================
   事件绑定
   ========================================================= */
$('#projName').addEventListener('input', e => {
  state.projectName = e.target.value || '未命名工程';
});
$$('#modeSeg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#playBtn').addEventListener('click', () => state.playing ? stop() : play());
$('#stopBtn').addEventListener('click', stop);
$('#delBtn').addEventListener('click', deleteSelected);
$('#dupBtn').addEventListener('click', duplicateSelected);
$('#saveBtn').addEventListener('click', saveJSON);
$('#loadBtn').addEventListener('click', () => $('#fileInput').click());
$('#htmlBtn').addEventListener('click', exportHTML);
$('#b64Btn').addEventListener('click', copyB64);
$('#b64InBtn').addEventListener('click', () => {
  $('#b64Input').value = '';
  $('#b64Modal').classList.add('on');
  setTimeout(() => $('#b64Input').focus(), 50);
});
$('#b64Cancel').addEventListener('click', () => $('#b64Modal').classList.remove('on'));
$('#b64Ok').addEventListener('click', () => {
  const v = $('#b64Input').value.trim();
  if (!v) return;
  try {
    const text = fromB64(v);
    if (loadJSON(text)) $('#b64Modal').classList.remove('on');
  } catch (e) { toast('Base64 解析失败：' + e.message); }
});
$('#saveObjBtn').addEventListener('click', saveSingleObject);
$('#loadObjBtn').addEventListener('click', () => $('#objFileInput').click());
$('#fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) { const r = new FileReader(); r.onload = () => loadJSON(r.result); r.readAsText(f); }
  e.target.value = '';
});
$('#objFileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadSingleObject(f);
  e.target.value = '';
});

/* ---------- 资源库事件 ---------- */
$('#assetBtn').addEventListener('click', () => {
  // 选中对象的名称作为默认
  const o = getSelected();
  $('#assetName').value = o ? o.name : '';
  $('#assetModal').classList.add('on');
  renderAssetList();
});
$('#assetClose').addEventListener('click', () => $('#assetModal').classList.remove('on'));
$('#assetModal').addEventListener('click', e => {
  if (e.target.id === 'assetModal') $('#assetModal').classList.remove('on');
});
$('#assetSaveCurrent').addEventListener('click', saveCurrentAsAsset);
$('#assetName').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveCurrentAsAsset();
});
$('#assetClearAll').addEventListener('click', () => {
  if (!AssetLib.list.length) return toast('资源库已是空的');
  if (!confirm('确定要清空全部 ' + AssetLib.list.length + ' 个资源吗？此操作不可恢复。')) return;
  AssetLib.clear();
  renderAssetList();
  toast('资源库已清空');
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { spaceDown = true; if (state.mode === '2d' && !state.playing) cv.style.cursor = 'grab'; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.playing) return;
    e.preventDefault();
    deleteSelected();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    duplicateSelected();
  }
  if (e.key.toLowerCase() === 'p' && !e.ctrlKey && !e.metaKey) {
    state.playing ? stop() : play();
  }
  if (state.mode === '3d' && three3d) {
    const k = e.key.toLowerCase();
    if (k === 'w') { state.gizmo = 'translate'; three3d.tc.setMode('translate'); }
    if (k === 'e') { state.gizmo = 'rotate'; three3d.tc.setMode('rotate'); }
    if (k === 'r') { state.gizmo = 'scale'; three3d.tc.setMode('scale'); }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceDown = false; if (state.mode === '2d') cv.style.cursor = 'crosshair'; }
});

const ro = new ResizeObserver(() => {
  if (state.mode === '2d') resize2d();
  else resize3d();
  requestAnimationFrame(updateAddBtnsScrollArrows);
});
ro.observe($('#viewport'));
window.addEventListener('resize', () => requestAnimationFrame(updateAddBtnsScrollArrows));

/* =========================================================
   启动
   ========================================================= */
AssetLib.load();
setupJoystick();
seed();
renderAddButtons();
renderHierarchy();
renderInspector();
resize2d();
updateStatus();

setTimeout(() => {
  $('#intro').classList.add('hide');
  setTimeout(() => { $('#intro').style.display = 'none'; }, 750);
  requestAnimationFrame(updateAddBtnsScrollArrows);
}, 1750);
</script>
</body>
</html>
